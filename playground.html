      // Subtle, single-token ghost text, shared by Laua and ordinary Luau.
      // No multiline templates or hallucinated variable/member names.
      for (const languageId of ["laua", "lua"]) monaco.languages.registerInlineCompletionsProvider(languageId, {
        async provideInlineCompletions(model, position) {
          const line = model.getLineContent(position.lineNumber);
          const before = line.slice(0, position.column - 1);
          const partialMatch = before.match(/([A-Za-z_][A-Za-z_0-9]*)$/);
          if (!partialMatch || partialMatch[1].length < 2) return { items: [] };
          const partial = partialMatch[1];
          const lower = partial.toLowerCase();
          const source = model.getValue();
          const cursorOffset = model.getOffsetAt(position);
          const masked = maskNonCode(source, true);
          const isMasked = cursorOffset > 0 && masked[cursorOffset - 1] === " ";
          const isLaua = model.getLanguageId() === "laua";
          const typeContext = /(?:\b(?:type|export\s+type)\s+[A-Za-z_][A-Za-z_0-9]*(?:<[^>]*>)?\s*=|::|:|\||&)\s*[A-Za-z_0-9]*$/.test(before);
          const makeSuggestion = name => ({
            insertText: name,
            range: new monaco.Range(position.lineNumber, position.column - partial.length, position.lineNumber, position.column)
          });
          const choose = (names, important = []) => {
            // Suppress ghost text too when the full word is already valid.
            // In particular, `print` must not ghost-complete to `printidentity`.
            if (names.some(name => name === partial)) return { items: [] };
            const all = [...new Set(names)].filter(name =>
              typeof name === "string" && name.toLowerCase().startsWith(lower) && name.toLowerCase() !== lower);
            if (!all.length) return { items: [] };
            // Prefer exact case and common short roots (print over printidentity).
            const rank = name => (name.startsWith(partial) ? 20 : 0) +
              (important.includes(name) ? 15 : 0) - (name.length - partial.length) * 2;
            all.sort((a, b) => rank(b) - rank(a) || a.length - b.length || a.localeCompare(b));
            // If two unrelated identifiers are equally plausible, keep silent.
            if (all.length > 1 && rank(all[0]) - rank(all[1]) < 5 &&
              !all[1].toLowerCase().startsWith(all[0].toLowerCase())) return { items: [] };
            return { items: [makeSuggestion(all[0])] };
          };

          const attributeMatch = before.match(/@([A-Za-z_][A-Za-z_0-9]*)$/);
          if (attributeMatch && !isMasked) return choose(LUAU_ATTRIBUTES.map(value => value.slice(1)));
          const directiveMatch = before.match(/--!([A-Za-z_][A-Za-z_0-9]*)$/);
          if (directiveMatch) return choose(LUAU_DIRECTIVES.map(value => value.slice(3)));

          const stringArgument = /(?:\bInstance\.new|\bgame:GetService|\bUserSettings\s*\(\s*\)\s*:GetService|\w+:(?:IsA|FindFirstChildOfClass|FindFirstChildWhichIsA))\s*\(\s*["'][A-Za-z_\w]*$/.test(before);
          if (isMasked && !stringArgument) return { items: [] };
          if (stringArgument) {
            if (!ROBLOX_API.ready) await ensureRobloxApiLoaded();
            const matches = completeRobloxStringArgument(model, position, before);
            return choose((matches?.suggestions || []).map(item => item.label));
          }

          const symbols = getProjectSymbols(model);
          const memberMatch = getCompletionMemberContext(before);
          if (memberMatch && !isTypeAnnotationCompletion(before, symbols, cursorOffset, isLaua)) {
            const owner = memberMatch.owner;
            const operator = memberMatch.operator;
            if (!ROBLOX_API.ready && (owner === "game" || owner === "workspace" || owner === "Enum" ||
               owner === "UserSettings()" || owner === "settings()" || owner?.includes("GetService(") ||
               symbols.locals[owner]?.service || symbols.locals[owner]?.robloxClass)) {
              await ensureRobloxApiLoaded();
            }
            if (owner && isBufferVariable(symbols, owner)) return { items: [] };
            const members = !owner ? null : (owner.includes(".") || owner.includes(":") || owner.includes("("))
              ? getChainedMembers(symbols, owner, cursorOffset)
              : getSymbolMembers(symbols, owner, operator, cursorOffset);
            if (!members) return { items: [] };
            const methodNames = Object.keys(members).filter(name =>
              shouldSuggestMember(symbols, owner, operator, name, members[name]));
            return choose(methodNames);
          }

          const classMatch = before.match(/\bnew\s+[A-Za-z_]\w*$/);
          if (classMatch && isLaua) return choose(Object.keys(symbols.classes));

          if (typeContext) {
            if (!ROBLOX_API.ready && partial.length >= 2) await ensureRobloxApiLoaded();
            return choose([
              ...LUAU_TYPE_WORDS, ...LUAU_BUILTIN_TYPES,
              ...Object.keys(symbols.classes), ...(ROBLOX_API.ready ? ROBLOX_API.classes.keys() : [])
            ], ["number", "string", "boolean", "Secret"]);
          }

          const keywords = isLaua ? [...LUAU_KEYWORDS, ...LAUA_KEYWORDS.filter(name => name !== "self")] : LUAU_KEYWORDS;
          const builtinNames = [
            ...keywords, ...LUAU_GLOBAL_FUNCTIONS, ...LUAU_GLOBAL_OBJECTS,
            ...LUAU_LIBRARIES, ...LUAU_RUNTIME_CONSTRUCTORS, ...LUAU_GLOBAL_CONSTANTS,
            ...(isLaua ? LAUA_GLOBAL_FUNCTIONS : []),
            ...Object.keys(symbols.locals), ...Object.keys(symbols.localFunctions),
            ...Object.keys(symbols.parameters), ...Object.keys(symbols.namespaces),
            ...Object.keys(symbols.classes), ...Object.keys(symbols.enums)
          ];
          if (isLaua && hasImplicitSelfAtOffset(source, symbols, cursorOffset)) builtinNames.push("self");
          return choose(builtinNames, ["print", "warn", "local", "function", "return", "require", "game", "workspace", "task"]);
        },
        freeInlineCompletions() {}
      });

      monaco.languages.registerHoverProvider("laua", {
        provideHover(model, position) {
          const wordInfo = model.getWordAtPosition(position);
          if (!wordInfo) return null;

          const word = wordInfo.word;
          const symbols = getLauaSymbols(model.getValue());
          const contents = [];

          const lineText = model.getLineContent(position.lineNumber);
          const cursorIndex = position.column - 1;

          const attributeOccurrences = [...lineText.matchAll(/@[A-Za-z_][A-Za-z0-9_]*/g)];

          for (const occurrence of attributeOccurrences) {
            const attribute = occurrence[0];
            const index = occurrence.index;

            if (
              cursorIndex >= index &&
              cursorIndex <= index + attribute.length &&
              LUAU_SPECIAL_DOCS[attribute]
            ) {
              return {
                range: new monaco.Range(
                  position.lineNumber,
                  index + 1,
                  position.lineNumber,
                  index + attribute.length + 1
                ),
                contents: [
                  { value: `**Luau attribute \`${attribute}\`**` },
                  { value: LUAU_SPECIAL_DOCS[attribute] }
                ]
              };
            }
          }

          const directiveOccurrence = lineText.match(/--!(?:strict|nonstrict|nocheck|native|nolint|optimize)\\b/);

          if (directiveOccurrence) {
            const directive = directiveOccurrence[0];
            const index = directiveOccurrence.index;

            if (
              cursorIndex >= index &&
              cursorIndex <= index + directive.length &&
              LUAU_SPECIAL_DOCS[directive]
            ) {
              return {
                range: new monaco.Range(
                  position.lineNumber,
                  index + 1,
                  position.lineNumber,
                  index + directive.length + 1
                ),
                contents: [
                  { value: `**Luau directive \`${directive}\`**` },
                  { value: LUAU_SPECIAL_DOCS[directive] }
                ]
              };
            }
          }

          if (LAUA_DOCS[word]) {
            contents.push({ value: `**Laua keyword \`${word}\`**` });
            contents.push({ value: LAUA_DOCS[word] });
          } else if (symbols.classes[word]) {
            const info = symbols.classes[word];
            contents.push({
              value: `**class \`${word}\`${info.base ? ` extends \`${info.base}\`` : ""}**`
            });

            const instanceCount = Object.keys(info.instanceMembers).length;
            const staticCount = Object.keys(info.staticMembers).length;
            contents.push({ value: `${instanceCount} instance member(s), ${staticCount} static member(s).` });
          } else if (symbols.namespaces[word]) {
            const count = Object.keys(symbols.namespaces[word].members).length;
            contents.push({ value: `**namespace \`${word}\`**` });
            contents.push({ value: `${count} exported member(s).` });
          } else if (symbols.enums[word]) {
            const members = Object.keys(symbols.enums[word].members);
            contents.push({ value: `**enum \`${word}\`**` });
            contents.push({ value: members.length ? members.map(x => `\`${x}\``).join(", ") : "No members." });
          } else if (symbols.locals[word]) {
            contents.push({ value: `**local \`${word}\`**` });
            contents.push({ value: symbols.locals[word].detail || "Local variable." });
          } else if (symbols.localFunctions[word]) {
            const fn = symbols.localFunctions[word];
            contents.push({ value: `**function \`${word}(${fn.params || ""})\`**` });
          } else if (symbols.parameters[word]) {
            contents.push({ value: `**parameter \`${word}\`**` });
            contents.push({ value: symbols.parameters[word].detail || "Function parameter." });
          }

          if (contents.length === 0) return null;

          return {
            range: new monaco.Range(
              position.lineNumber,
              wordInfo.startColumn,
              position.lineNumber,
              wordInfo.endColumn
            ),
            contents
          };
        }
      });

      monaco.languages.registerDocumentSymbolProvider("laua", {
        provideDocumentSymbols(model) {
          const symbols = getLauaSymbols(model.getValue());
          const result = [];

          const add = (name, kind, start, end, detail = "") => {
            result.push({
              name,
              detail,
              kind,
              range: makeRangeFromOffsets(model, start, end),
              selectionRange: makeRangeFromOffsets(model, start, Math.min(end, start + name.length + 16)),
              children: []
            });
          };

          for (const info of Object.values(symbols.classes)) {
            add(info.name, monaco.languages.SymbolKind.Class, info.start, info.end, info.base ? `extends ${info.base}` : "");

          for (const info of Object.values(symbols.namespaces)) {

      // API-driven event signature help and small, non-invasive inline tip.
      // Roblox event arguments are read from the live API dump whenever
      // available; only a small core set is used if offline.
      const LAUA_EVENT_SIGNATURE_FALLBACK = Object.freeze({
        UserInputService: {
          InputBegan: "input: InputObject, gameProcessed: boolean",
          InputEnded: "input: InputObject, gameProcessed: boolean",
          InputChanged: "input: InputObject, gameProcessed: boolean",
          TouchStarted: "touch: InputObject, gameProcessed: boolean",
          TouchEnded: "touch: InputObject, gameProcessed: boolean",
          JumpRequest: ""
        },
        RunService: {
          Heartbeat: "deltaTime: number",
          RenderStepped: "deltaTime: number",
          Stepped: "time: number, deltaTime: number",
          PreSimulation: "deltaTimeSim: number",
          PostSimulation: "deltaTimeSim: number"
        },
        Player: { CharacterAdded: "character: Model", CharacterRemoving: "character: Model", Chatted: "message: string, recipient: Player?" },
        Players: { PlayerAdded: "player: Player", PlayerRemoving: "player: Player" },
        BasePart: { Touched: "otherPart: BasePart", TouchEnded: "otherPart: BasePart" },
        Humanoid: { Died: "", HealthChanged: "health: number", Running: "speed: number" },
        RemoteEvent: { OnServerEvent: "player: Player, ...: any", OnClientEvent: "...: any" },

      const LAUA_FUNCTION_CALLBACK_SIGNATURES = Object.freeze({

        "table.findWhere": "value: any, index: number",
        "table.reduce": "accumulator: any, value: any, index: number",
        "table.sort": "a: any, b: any"

      function displayRobloxCallbackType(type) {

        if (/^(?:int|int64|float|double|long|number)$/i.test(name)) return "number";

      }
      function findLauaCallbackHint(model, position) {

        // trigger; avoid misidentifying nested calls or ordinary functions.
        const anonymous = /\bfunction\s*\(([^()\n]*)$/.exec(maskedBefore);
        if (!anonymous) return null;
        const prior = before.slice(0, anonymous.index);
        const connectMatch = /:\s*(Connect|Once|ConnectParallel)\s*\(\s*$/.exec(maskNonCode(prior, true));
        const symbols = getLauaSymbols(model.getValue());
        let params = null;
        let label = "Callback";
        if (connectMatch) {
          const eventText = prior.slice(0, connectMatch.index);
          const eventMatch = /\.\s*([A-Za-z_]\w*)\s*$/.exec(eventText);
          if (eventMatch) {
            const eventName = eventMatch[1];
            const receiver = eventText.slice(0, eventMatch.index).trim().match(/(?:[A-Za-z_]\w*(?:\s*:\s*\w+\s*\([^\n)]*\)|\s*\.\s*\w+)*)$/)?.[0]?.trim();
            if (receiver) {
              const members = /[.:(]/.test(receiver) ? getChainedMembers(symbols, receiver, model.getOffsetAt(position)) : getSymbolMembers(symbols, receiver, ".", model.getOffsetAt(position));
              const eventInfo = members?.[eventName];
              if (eventInfo?.kind === "event" && Array.isArray(eventInfo.apiMember?.Parameters)) {
                params = eventInfo.apiMember.Parameters.map(item => `${item.Name || "value"}: ${displayRobloxCallbackType(item.Type)}`).join(", ");
              }
              if (params === null) {
                const root = receiver.match(/^([A-Za-z_]\w*)/)?.[1];
                const service = symbols.locals[root]?.service || symbols.locals[root]?.robloxClass || symbols.parameters[root]?.type ||
                  receiver.match(/GetService\s*\(\s*["']([A-Za-z_]\w*)["']\s*\)/)?.[1] ||
                  (root === "game" ? "DataModel" : root === "workspace" ? "Workspace" : null);
                params = LAUA_EVENT_SIGNATURE_FALLBACK[service]?.[eventName] ?? null;
              }
              if (params !== null) label = `${eventName} callback`;
            }
          }
        } else {
          const callMatch = /\b(table\s*\.\s*(?:map|filter|reduce|findWhere|sort))\s*\([^\n]*,\s*$/.exec(maskNonCode(prior, true));
          if (callMatch) {

      monaco.languages.registerSignatureHelpProvider("laua", {
        signatureHelpTriggerCharacters: ["(", ","],

        provideSignatureHelp(model, position) {
          const callback = findLauaCallbackHint(model, position);
          if (callback) {
            const parameters = callback.params ? callback.params.split(/,\s*/).filter(Boolean) : [];
            return {
              value: {
                signatures: [{label: `${callback.label}(${callback.params})`, documentation: "Expected callback parameters (you can rename the variables)", parameters: parameters.map(label => ({label}))}],
                activeSignature: 0,
                activeParameter: Math.min(callback.activeParameter, Math.max(0, parameters.length - 1))
              },
              dispose() {}
            };
          }
          const line = model.getLineContent(position.lineNumber).slice(0, position.column - 1);
          const match = line.match(/([A-Za-z_][A-Za-z0-9_]*)(?:([.:])([A-Za-z_][A-Za-z0-9_]*))?\s*\(([^()]*)$/);
          if (!match) return null;

          const symbols = getLauaSymbols(model.getValue());
          const owner = match[1];
          const operator = match[2];
          const member = match[3];
          const currentArgs = match[4];
          let fnName = owner;
          let params = "";

          if (member) {
            const members = getSymbolMembers(symbols, owner, operator, model.getOffsetAt(position));
            const info = members?.[member];
            if (!info || info.kind !== "function") return null;

            fnName = `${owner}${operator}${member}`;
            params = info.params || "";
          } else if (symbols.localFunctions[owner]) {
            params = symbols.localFunctions[owner].params || "";
          } else {
            return null;
          }

          const parameterNames = params
            ? params.split(",").map(x => x.trim()).filter(Boolean)
            : [];

          return {
            value: {
              signatures: [{
                label: `${fnName}(${params})`,
                documentation: "Laua/Luau function",
                parameters: parameterNames.map(x => ({ label: x }))
              }],
              activeSignature: 0,
              activeParameter: Math.min(
                currentArgs.trim() === "" ? 0 : currentArgs.split(",").length - 1,
                Math.max(0, parameterNames.length - 1)

            dispose() {}
          };
        }
      });

      function findDeclaredSymbolOffset(source, name) {
        const masked = maskNonCode(source), safe=name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
        const patterns=[
          new RegExp(`\\b(?:class|enum|namespace|function|type)\\s+(${safe})\\b`),
          new RegExp(`\\blocal\\s+(?:function\\s+)?(${safe})\\b`)
        ];
        for(const pattern of patterns){
          const match=pattern.exec(masked);
          if(match)return match.index+match[0].lastIndexOf(name);
        }
        return -1;
      }
      monaco.languages.registerDefinitionProvider("laua", {
        provideDefinition(model, position) {
          const wordInfo=model.getWordAtPosition(position);
          if(!wordInfo)return null;
          const word=wordInfo.word,source=model.getValue(),current=findFileByModel(model);
          if(current){
            const line=model.getLineContent(position.lineNumber);
            const owner=/([A-Za-z_]\w*)\s*\.\s*$/.exec(line.slice(0,wordInfo.startColumn-1))?.[1];
            for(const imp of scanProjectImports(current.name,source)){
              const remote=imp.target && projectFiles.get(imp.target);
              if(!remote)continue;
              const exported=scanProjectExports(remote.model.getValue());
              let remoteName=null;
              if(imp.named){
                for(const clause of imp.named.split(',')){
                  const m=clause.trim().match(/^([A-Za-z_]\w*)(?:\s+as\s+([A-Za-z_]\w*))?$/);
                  if(m && (m[2]||m[1])===word && exported[m[1]])remoteName=m[1];
                }
              }
              if(imp.name===owner && exported[word])remoteName=word;
              if(remoteName){
                const offset=findDeclaredSymbolOffset(remote.model.getValue(),remoteName);
                if(offset>=0)return {uri:remote.model.uri,range:makeRangeFromOffsets(remote.model,offset,offset+remoteName.length)};
              }
            }
          }
          const symbols=getLauaSymbols(source);
          const info=symbols.classes[word]||symbols.namespaces[word]||symbols.enums[word];
          const offset=info?.start ?? findDeclaredSymbolOffset(source,word);
          if(offset<0 || !Number.isInteger(offset))return null;
          const declarationStart=info?.start!==undefined ? source.indexOf(word,offset) : offset;
          const at=declarationStart>=0?declarationStart:offset;
          return {uri:model.uri,range:makeRangeFromOffsets(model,at,at+word.length)};
        }
      });

      // One Monaco model per project file: the editor, lint, cursor and undo
      // history are independent even though the transpiler remains single-file.
      const projectFiles = new Map();
      // Keep the existing key to preserve v3.10-v3.12 user projects.
      const PROJECT_KEY = "laua-playground-project-v3.10";
      const RECOVERY_KEY = "laua-playground-startup-recovery-v3.13";
      let activeFile = null;
      let projectReady = false;
      let playgroundInitialized = false;
      const projectTabBar = document.getElementById("fileTabs");
      const projectStatus = () => document.getElementById("status");
      const modeSelection = () => document.getElementById("modeSelect").value;

      function normalizeProjectFilename(input) {
        let name = String(input || "").trim().replace(/\\/g, "/");
        name = name.replace(/^\/+/, "");
        if (!/\.(?:laua|luau)$/.test(name)) name += ".laua";
        const pieces = name.split("/");
        if (pieces.some((part,index) => part === ".." || part === "." || (index === pieces.length-1 ? !/^[A-Za-z_][A-Za-z0-9_]*\.(?:laua|luau)$/.test(part) : !/^[A-Za-z_][A-Za-z0-9_]*$/.test(part)))) {
          throw new Error("Use file names like main.laua, main.luau, or Modules/Zombie.laua (letters, digits and underscores only).");
        }
        return name;
      }

      function removeLauaExtension(path) { return path.replace(/\.(?:laua|luau)$/, ""); }
      function isCompiledLuauFile(file) { return file.name.endsWith(".luau"); }
      function initialProjectFile() { return projectFiles.has("main.laua") ? "main.laua" : projectFiles.has("main.luau") ? "main.luau" : projectFiles.keys().next().value; }

      function resolveProjectImport(fromFile, importPath) {
        if (!/^(?:\.\/|\.\.\/)/.test(importPath)) return null;
        const base = fromFile.split("/").slice(0, -1);
        for (const part of importPath.replace(/\\/g, "/").split("/")) {
          if (!part || part === ".") continue;
          if (part === "..") {
            if (!base.length) return null;
            base.pop();
          } else {
            if (!/^[A-Za-z_][A-Za-z0-9_]*(?:\.laua)?$/.test(part)) return null;
            base.push(part);
          }
        }
        const target = base.join("/");
        return target.endsWith(".laua") ? target : target + ".laua";
      }

      const scanCacheImports=new Map(),scanCacheExports=new Map();
      function cacheProjectScan(cache,key,value) {
        if(cache.size>=100)cache.clear();

      }
      function scanProjectImports(fileName, source) {
        const key=fileName+"\u0000"+source;

        const sourceLines = source.split("\n");
        for (let row = 0; row < sourceLines.length; row++) {
          const code = sourceLines[row];
          const trimmed = maskNonCode(code).trim();
          if (!/^import\b/.test(trimmed)) continue;
          const match = code.match(/^\s*import\s+(?:([A-Za-z_]\w*)|\{([^{}]+)\})\s+from\s+["']([^"'\n]+)["']\s*$/);
          if (!match) continue; // ordinary parser/linter handles malformed imports

        }
        return cacheProjectScan(scanCacheImports,key,imports);
      }

      function scanProjectExports(source) {
        if(scanCacheExports.has(source))return scanCacheExports.get(source);
        const exports = {};
        const pattern = /^\s*export\s+(?:(?:final|abstract)\s+)?(class|namespace|enum|(?:local\s+)?(?:async\s+)?function|local)\s+([A-Za-z_]\w*)/gm;
        for (const m of source.matchAll(pattern)) {
          const rawKind = m[1];
          const kind = rawKind.endsWith("function") ? "function" : rawKind === "local" ? "field" : rawKind;
          exports[m[2]] = {kind, name:m[2]};
        }
        return cacheProjectScan(scanCacheExports,source,exports);
      }

      function getProjectSymbols(model) {
        const current = findFileByModel(model);
        const localSymbols = getLauaSymbols(model.getValue());
        if (!current) return localSymbols;
        for (const imp of scanProjectImports(current.name, model.getValue())) {
          const imported = imp.target && projectFiles.get(imp.target);
          if (!imported) continue;
          const exports = scanProjectExports(imported.model.getValue());
          let remoteSymbols = null;
          try {
            // The original symbol scanner recognizes `class X` but not
            // `export class X`. Strip only the export prefix for indexing.
            const indexedSource = imported.model.getValue().replace(/^(\s*)export\s+(?=(?:abstract\s+|final\s+)?(?:class|enum|namespace|(?:local\s+)?(?:async\s+)?function|local)\b)/gm, "$1");
            remoteSymbols = getLauaSymbols(indexedSource);
          } catch { continue; }
          if (imp.name) {
            localSymbols.namespaces[imp.name] = {
              name:imp.name, start:0, end:0,
              members:Object.fromEntries(Object.entries(exports).map(([key,value]) => [key, {kind:value.kind === "function" ? "function" : "field", detail:`Export from ${imp.target}`}]))
            };
          }
          if (imp.named) {
            for (const clause of imp.named.split(",")) {
              const named = clause.trim().match(/^([A-Za-z_]\w*)(?:\s+as\s+([A-Za-z_]\w*))?$/);
              if (!named || !exports[named[1]]) continue;
              const original = named[1], alias = named[2] || named[1];
              const info = exports[original];
              if (info.kind === "class" && remoteSymbols.classes[original]) {

              } else if (info.kind === "namespace" && remoteSymbols.namespaces[original]) {
                if (!localSymbols.namespaces[alias]) localSymbols.namespaces[alias] = {...remoteSymbols.namespaces[original], name:alias, start:-1, end:-1};
              } else if (info.kind === "enum" && remoteSymbols.enums[original]) {
                if (!localSymbols.enums[alias]) localSymbols.enums[alias] = {...remoteSymbols.enums[original], name:alias, start:-1, end:-1};
              } else if (info.kind === "function") {
                localSymbols.localFunctions[alias] = remoteSymbols.localFunctions[original] || {name:alias,params:"",detail:`Import from ${imp.target}`};

      function findFileByModel(model) {
        if (!model) return null;
        for (const file of projectFiles.values()) if (file.model === model) return file;
        return null;
      }

      function projectImportMarkers(file) {
        const markers = [];
        for (const imp of scanProjectImports(file.name,file.model.getValue())) {
          const targetFile = imp.target && projectFiles.get(imp.target);
          let message = null;
          if (!imp.target) message = `Invalid project import '${imp.path}'.`;
          else if (!targetFile) message = `Missing project file '${imp.target}' (imported as ${imp.path}).`;
          else if (imp.named) {
            const exports = scanProjectExports(targetFile.model.getValue());
            for (const part of imp.named.split(",")) {
              const name = part.trim().match(/^([A-Za-z_]\w*)/);
              if (name && !exports[name[1]]) {

                break;

      function refreshFileMarkers(file) {
        if (isCompiledLuauFile(file)) {
          monaco.editor.setModelMarkers(file.model,"laua",[]);
          monaco.editor.setModelMarkers(file.model,"laua-project",[]);
          file.errors=0;file.warnings=0;
          return {errors:0,warnings:0,hints:0,directives:readPlaygroundDirectives(file.model.getValue())};
        }
        const result = updateLauaDiagnostics(file.model);
        const base = monaco.editor.getModelMarkers({owner:"laua",resource:file.model.uri}) || [];
        const projectErrors = projectImportMarkers(file);
        const source=file.model.getValue(),masked=maskNonCode(source);

            const found=piece.trim().match(/^([A-Za-z_]\w*)(?:\s+as\s+([A-Za-z_]\w*))?$/);

            }
          }
        }
        monaco.editor.setModelMarkers(file.model,"laua-project",projectErrors);
        file.errors = (result?.errors || 0) + projectErrors.filter(item=>item.severity===monaco.MarkerSeverity.Error).length;
        file.warnings = (result?.warnings || 0) + projectErrors.filter(item=>item.severity===monaco.MarkerSeverity.Warning).length;
        return {errors:file.errors, warnings:file.warnings, hints:result?.hints || 0, directives:result?.directives};
      }

      function lintAllProjectFiles() {
        let errors=0, warnings=0;
        for (const file of projectFiles.values()) {
          const res=refreshFileMarkers(file);
          errors+=res.errors;
          warnings+=res.warnings;
        }
        renderProjectTabs();
        return {errors,warnings};
      }

      function rememberProject() {
        if (!projectReady) return;
        try {
          const value = {active:activeFile,files:[...projectFiles.values()].map(f=>({name:f.name,source:f.model.getValue()}))};
          localStorage.setItem(PROJECT_KEY,JSON.stringify(value));
        } catch (error) {
          // Storage can be disabled in private or file:// contexts. Editing still works.
          console.warn("Laua project autosave unavailable:",error);
        }
      }

      function restoredProject() {
        try {
          const rawSaved=localStorage.getItem(PROJECT_KEY);
          const saved=JSON.parse(rawSaved || "null");
          if (!saved || !Array.isArray(saved.files) || !saved.files.length || saved.files.length > 100) return null;
          const seen=new Set(), safe=[];
          for (const entry of saved.files) {
            if (!entry || typeof entry.name !== "string" || typeof entry.source !== "string") return null;
            const name=normalizeProjectFilename(entry.name);
            if (seen.has(name)) return null;
            seen.add(name);
            // The old demo or a blank main file should never result in an empty
            // startup editor. Keep an exact recovery copy of the old project.
            const oldDemo = name === "main.laua" && entry.source === PREVIOUS_MAIN_STARTER;
            const blankMain = name === "main.laua" && entry.source.trim() === "";
            if (blankMain || oldDemo) {
              try {
                if (!localStorage.getItem(RECOVERY_KEY)) {
                  localStorage.setItem(RECOVERY_KEY, JSON.stringify(saved));
                }
              } catch {}
            }
            safe.push({name,source:(blankMain || oldDemo) ? STARTER : entry.source});
          }
          // A deleted main.laua must not make the next visit open Zombie.laua.
          if (!seen.has("main.laua") && !seen.has("main.luau")) {
            safe.unshift({name:"main.laua",source:STARTER});
          }
          // A tab selected last visit should NOT decide what opens next visit.
          // Its source is kept intact and the user can select the tab again.
          return {files:safe,active:"main.laua"};
        } catch (error) {
          try {
            const original=localStorage.getItem(PROJECT_KEY);
            if (original && !localStorage.getItem(RECOVERY_KEY)) localStorage.setItem(RECOVERY_KEY, original);
          } catch {}
          console.warn("Saved Laua project could not be restored:", error);
          return null;
        }
      }

      function createProjectFile(name,source="", options={}) {
        const normalized=normalizeProjectFilename(name);
        if (projectFiles.has(normalized)) throw new Error(`'${normalized}' already exists.`);
        const uri=monaco.Uri.parse(`inmemory://laua/${normalized}`);
        const model=monaco.editor.createModel(source,normalized.endsWith(".luau") ? "lua" : "laua",uri);
        const output=monaco.editor.createModel("","lua",monaco.Uri.parse(`inmemory://laua-output/${removeLauaExtension(normalized)}.luau`));
        const file={name:normalized,model,output,sourceView:null,outputView:null,errors:0,warnings:0,generated:null};
        file.disposeChange=model.onDidChangeContent(()=>{
          file.generated=null;
          file.generatedForce=false;
          file.output.setValue("");
          rememberProject();
          refreshEditorIntelligence();
        });
        projectFiles.set(normalized,file);
        if (!options.silent) { switchProjectFile(normalized); rememberProject(); }
        return file;
      }

      function switchProjectFile(name) {
        const next=projectFiles.get(name);
        if (!next) throw new Error(`Missing file '${name}'.`);
        if (activeFile && projectFiles.has(activeFile)) {
          const previous=projectFiles.get(activeFile);
          previous.sourceView=lauaEditor.saveViewState();
          previous.outputView=luauEditor.saveViewState();
        }
        activeFile=name;
        lauaEditor.setModel(next.model);
        luauEditor.setModel(next.output);
        if (next.sourceView) lauaEditor.restoreViewState(next.sourceView);
        if (next.outputView) luauEditor.restoreViewState(next.outputView);
        document.getElementById("outputFilename").textContent=removeLauaExtension(name)+".luau · read only";
        renderProjectTabs();
        refreshEditorIntelligence();
        rememberProject();
        // Each tab has an independent output model; populate it when the
        // user switches tabs instead of leaving the right-hand pane blank.
        if (playgroundInitialized) runTranspile();
      }

      function renderProjectTabs() {
        projectTabBar.replaceChildren();
        for (const file of projectFiles.values()) {
          const tab=document.createElement("button");
          tab.type="button";
          tab.className="file-tab"+(file.name===activeFile?" active":"");
          tab.setAttribute("role","tab");
          tab.setAttribute("aria-selected",file.name===activeFile?"true":"false");
          tab.title=file.name;
          const label=document.createElement("span");label.textContent=file.name;
          tab.appendChild(label);
          if (file.errors) { const indicator=document.createElement("span");indicator.className="file-error";indicator.textContent=`${file.errors}!`;tab.appendChild(indicator); }
          const close=document.createElement("span");
          close.className="file-close";close.setAttribute("aria-label",`Close ${file.name}`);close.textContent="×";
          close.setAttribute("role","button");close.setAttribute("tabindex","0");
          close.addEventListener("click", event=>{event.stopPropagation();deleteProjectFile(file.name);});

      function deleteProjectFile(name) {
        if (!projectFiles.has(name)) return;
        if (projectFiles.size===1) { projectStatus().textContent="You must keep at least one Laua file. Use Clear to empty it.";return; }
        if (!confirm(`Close and delete '${name}' from this browser project?`)) return;
        const files=[...projectFiles.keys()],index=files.indexOf(name);
        const file=projectFiles.get(name);
        projectFiles.delete(name);
        file.disposeChange.dispose();
        if (activeFile===name) {activeFile=null; switchProjectFile(files[index+1] && projectFiles.has(files[index+1])?files[index+1]:files[index-1]);}
        file.model.dispose();file.output.dispose();
        rememberProject();lintAllProjectFiles();renderProjectTabs();
      }

      function projectRelativePath(fromFile,toFile) {
        const folder=fromFile.split("/").slice(0,-1);
        const target=removeLauaExtension(toFile).split("/");
        while(folder.length && target.length && folder[0]===target[0]) {folder.shift();target.shift();}
        const path=[...folder.map(()=>".."),...target].join("/");
        return path.startsWith(".") ? path : "./"+path;

      function updateProjectImportPaths(oldName,newName) {
        for (const file of projectFiles.values()) {
          if(file.name===newName) continue;
          const lines=file.model.getValue().split("\n");
          let changed=false;
          for(const imp of scanProjectImports(file.name,file.model.getValue())) {
            if(imp.target!==oldName) continue;
            const updated=projectRelativePath(file.name,newName);
            // Only alter the path of a valid import declaration.
            const line=lines[imp.line-1];
            lines[imp.line-1]=line.replace(/(\bfrom\s+)(["'])([^"'\n]+)\2\s*$/,(_full,prefix,quote)=>`${prefix}${quote}${updated}${quote}`);
            changed=changed || lines[imp.line-1]!==line;
          }
          if(changed)file.model.setValue(lines.join("\n"));
        }
      }

      function renameProjectFile(previous,desired) {
        const nextName=normalizeProjectFilename(desired);
        if (nextName===previous) return;
        if (projectFiles.has(nextName)) throw new Error(`'${nextName}' already exists.`);
        const original=projectFiles.get(previous);
        if (!original) return;
        // Monaco model URIs cannot be renamed. Create a new file and switch to it.
        const replacement=createProjectFile(nextName,original.model.getValue(),{silent:true});
        replacement.output.setValue(original.output.getValue());
        replacement.generated=original.generated;
        projectFiles.delete(previous);
        updateProjectImportPaths(previous,nextName);
        original.disposeChange.dispose();
        original.model.dispose();original.output.dispose();
        if (activeFile===previous) { activeFile=null; switchProjectFile(nextName); }
        rememberProject();lintAllProjectFiles();renderProjectTabs();

    // Lossless mappings for unchanged source lines. Generated/transformed lines are
    // deliberately unmapped rather than pointing to a misleading source line.
    function makeSourceLineMap(source, generated, name) {
      const originals = source.replace(/\r\n/g, "\n").split("\n");
      const emitted = generated.replace(/\r\n/g, "\n").split("\n");
      const positions = new Map();
      for (let i=0;i<originals.length;i++) {
        const line=originals[i].trim();
        if (!line) continue;
        if (!positions.has(line)) positions.set(line, []);
        positions.get(line).push(i+1);
      }
      const used = new Map();
      const mappings = emitted.map((line,index) => {
        const key=line.trim(),matches=positions.get(key);
        if (!key || !matches) return null;
        const count=used.get(key)||0;
        if (count >= matches.length) return null;
        used.set(key,count+1);
        return {generatedLine:index+1,sourceLine:matches[count]};
      }).filter(Boolean);
      return {version:1,source:name,generated:removeLauaExtension(name)+".luau",kind:"exact-unchanged-lines",mappings};
    }
      function compileProjectFiles() {
        const result=[];
        // Never discard a source file because another file fails to compile.
        for (const file of projectFiles.values()) {
          const entry={sourceName:file.name,source:file.model.getValue(),outputName:removeLauaExtension(file.name)+".luau",output:null,error:null};
          if (isCompiledLuauFile(file)) {
            entry.output=entry.source;
            result.push(entry);
            continue;
          }
          const sourcePreflight=refreshFileMarkers(file);
          if(sourcePreflight.errors){entry.error=`${sourcePreflight.errors} Laua preflight error(s)`;result.push(entry);continue;}
          const importErrors=projectImportMarkers(file);
          if (importErrors.length) {
            entry.error=importErrors.map(marker=>marker.message).join("; ");
          } else {
            try {entry.output=transpile(entry.source,{Mode:modeSelection(),OutputStyle:document.getElementById("outputStyleSelect").value});}
            catch (error) {entry.error=error?.message || String(error);}
          }
          result.push(entry);
        }
        const usedOutputs=new Map();
        for(const entry of result){
          const previous=usedOutputs.get(entry.outputName);
          if(previous){
            entry.error=`Conflicting output name: ${entry.outputName}`;
            previous.error=`Conflicting output name: ${entry.outputName}`;
          }else usedOutputs.set(entry.outputName,entry);
        }
        return result;
      }

      // A compiled-only Roblox XML model; source maps and source copies are NOT exported.
      // Export is deliberately blocked if any source failed, to prevent silent data loss.
      function makeProjectRbxmx(files) {
        const invalidXml = /[\u0000-\u0008\u000b\u000c\u000e-\u001f\ufffe\uffff]|[\ud800-\udbff](?![\udc00-\udfff])|(?<![\ud800-\udbff])[\udc00-\udfff]/u;
        const escapeXml = value => {
          const text=String(value);
          if(invalidXml.test(text))throw new Error("Project contains XML-invalid characters; fix them before exporting.");
          return text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;").replace(/\r/g,"&#13;");
        };
        const cdata = value => {
          const text=String(value);
          if(invalidXml.test(text))throw new Error("Compiled Luau contains XML-invalid characters.");
          return '<![CDATA['+text.replace(/]]>/g,']]]]><![CDATA[>')+']]>';
        };
        const errors=files.filter(f=>f.error || f.output === null).map(f=>f.sourceName+': '+(f.error||'Compilation failed'));
        if(errors.length)throw new Error('Cannot export a partial project. Fix compilation errors first: '+errors.join('; '));
        const folder=name=>({kind:'Folder',name,children:[],dirs:new Map()});
        const project=folder('LauaProject');
        const modules=folder('Modules');
        project.children.push(modules);
        for(const entry of files){
          const path=entry.outputName.split('/');
          let parent=modules;
          for(const segment of path.slice(0,-1)){
            if(!parent.dirs.has(segment)){
              const dir=folder(segment);parent.dirs.set(segment,dir);parent.children.push(dir);
            }

        }
        let referent=0;
        const fragments=['<?xml version="1.0" encoding="utf-8"?>\n',
          '<roblox xmlns:xmime="http://www.w3.org/2005/05/xmlmime" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://www.roblox.com/roblox.xsd" version="4">',
          '<External>null</External><External>nil</External>'];
        function emit(node){
          fragments.push('<Item class="',node.kind,'" referent="RBXLAUA',String(++referent),'">',
            '<Properties><string name="Name">',escapeXml(node.name),'</string>');
          if(node.kind==='ModuleScript')fragments.push('<ProtectedString name="Source">',cdata(node.value),'</ProtectedString>');
          fragments.push('</Properties>');
          for(const child of node.children||[])emit(child);
          fragments.push('</Item>');
        }
        emit(project);
        fragments.push('</roblox>');
        return {blob:new Blob([fragments.join('')],{type:'application/xml;charset=utf-8'}),errors:[]};
      }

      // Editable Studio export preserves original source, separately from the
      // existing compiled-only model. No source maps or runtime scripts needed.
      function makeStudioSourceRbxmx() {
        const invalidXml = /[\u0000-\u0008\u000b\u000c\u000e-\u001f\ufffe\uffff]|[\ud800-\udbff](?![\udc00-\udfff])|(?<![\ud800-\udbff])[\udc00-\udfff]/u;
        const escapeXml = value => {
          const str=String(value);
          if(invalidXml.test(str))throw new Error('Source contains XML-invalid characters.');
          return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;').replace(/\r/g,'&#13;');
        };
        const folder=name=>({kind:'Folder',name,children:[],dirs:new Map()});
        const project=folder('LauaStudioProject');
        const sources=folder('Sources');
        project.children.push(sources);
        for(const file of projectFiles.values()) {
          const path=normalizeProjectFilename(file.name).split('/');
          let parent=sources;
          for(const segment of path.slice(0,-1)) {
            if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(segment))throw new Error('Studio source folder needs a Luau identifier: '+segment);
            if(!parent.dirs.has(segment)) {
              const dir=folder(segment);parent.dirs.set(segment,dir);parent.children.push(dir);
            }
            parent=parent.dirs.get(segment);
          }
          const name=path.at(-1);
          if(!/^[A-Za-z_][A-Za-z0-9_]*\.(laua|luau)$/.test(name))throw new Error('Studio source file name must be a valid identifier with a .laua or .luau extension: '+name);
          parent.children.push({kind:'StringValue',name,value:file.model.getValue()});
        }
        let referent=0;
        const parts=['<?xml version="1.0" encoding="utf-8"?>\n','<roblox xmlns:xmime="http://www.w3.org/2005/05/xmlmime" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://www.roblox.com/roblox.xsd" version="4">','<External>null</External><External>nil</External>'];
        function emit(node) {
          parts.push('<Item class="',node.kind,'" referent="RBXLAUASTUDIO',String(++referent),'">','<Properties><string name="Name">',escapeXml(node.name),'</string>');
          if(node.kind==='StringValue')parts.push('<string name="Value">',escapeXml(node.value),'</string>');
          parts.push('</Properties>');
          for(const child of node.children||[])emit(child);
          parts.push('</Item>');
        }
        emit(project);
        parts.push('</roblox>');
        return new Blob([parts.join('')],{type:'application/xml;charset=utf-8'});
      }

      // XML import accepts our compiled-only model, old Laua models with
      // original sources, and simple Roblox models made of ModuleScripts.
      // Parsing and validation finish before the saved project is replaced.
      async function readLauaProjectRbxmx(blob) {
        if(blob.size>40*1024*1024)throw new Error('The Roblox model exceeds 40 MB.');
        const xml=await blob.text();
        if(/<!DOCTYPE|<!ENTITY/i.test(xml))throw new Error('XML DTDs and entities are not supported.');
        if(!/^\s*<\?xml\b|^\s*<roblox\b/.test(xml))throw new Error('Not a Roblox XML model.');
        const doc=new DOMParser().parseFromString(xml,'application/xml');
        if(doc.getElementsByTagName('parsererror').length || doc.documentElement?.tagName!=='roblox')throw new Error('Malformed Roblox XML model.');
        const children=(node,tag)=>Array.from(node.children).filter(el=>el.tagName===tag);
        const prop=(node,key)=>{
          const properties=children(node,'Properties')[0];
          return properties ? Array.from(properties.children).find(el=>el.getAttribute('name')===key)?.textContent : null;
        };
        const roots=children(doc.documentElement,'Item');
        if(!roots.length)throw new Error('Model contains no Roblox items.');
        const decoded=[];
        let total=0;
        function store(path,source){
          const filename=normalizeProjectFilename(path);
          if(decoded.some(item=>item.name===filename))throw new Error('Duplicate module: '+filename);
          if(source.length>2*1024*1024)throw new Error('Module exceeds 2 MB: '+filename);
          total+=source.length;
          if(total>20*1024*1024 || decoded.length>=100)throw new Error('The model exceeds Laua project limits.');
          decoded.push({name:filename,source});
        }
        function walk(item,path,kind){
          const type=item.getAttribute('class');
          const name=prop(item,'Name');
          if(!name || name==='.' || name==='..' || name.includes('/') || name.includes('\\'))throw new Error('Unsafe or missing Roblox item name.');
          if(type==='Folder' || type==='Model'){
            for(const child of children(item,'Item'))walk(child,path.concat(name),kind);
          }else if(kind==='source' && type==='StringValue'){
            const value=prop(item,'Value');
            if(value===null)throw new Error('Source entry has no Value: '+name);
            if(!name.endsWith('.laua') && !name.endsWith('.luau'))return;
            store(path.concat(name).join('/'),value);
          }else if(kind==='module' && type==='ModuleScript'){
            const value=prop(item,'Source');
            if(value===null)throw new Error('ModuleScript has no Source: '+name);
            store(path.concat(name.replace(/\.(?:luau|lua|laua)$/,'')+'.luau').join('/'),value);
          }
        }
        const project=roots.find(root=>prop(root,'Name')==='LauaProject' || prop(root,'Name')==='LauaStudioProject');
        const top=project ? children(project,'Item') : roots;
        const originalSources=top.find(item=>prop(item,'Name')==='LauaSources' || prop(item,'Name')==='Sources');
        if(originalSources){
          for(const item of children(originalSources,'Item'))walk(item,[],'source');
        }
        // Older Laua exports include source copies, which are preferred over
        // re-importing the compiled output. Otherwise import the Luau source.
        if(!decoded.length){
          const compiled=top.find(item=>prop(item,'Name')==='Modules');
          for(const item of compiled ? children(compiled,'Item') : top)walk(item,[],'module');
        }
        if(!decoded.length)throw new Error('No importable ModuleScripts were found.');
        return {files:decoded, originalLaua:decoded.some(entry=>entry.name.endsWith('.laua')), hasEditableSources:Boolean(originalSources)};
      }

      async function importProjectRbxmx(blob) {
        const imported=await readLauaProjectRbxmx(blob);
        const message=imported.hasEditableSources
          ? `Replace the current project with ${imported.files.length} editable source files from this model?`
          : `Import ${imported.files.length} compiled Luau ModuleScripts as editable .luau files? These files will bypass Laua-only transformations and diagnostics. Original Laua syntax cannot be recovered from compiled-only models. This replaces your saved project.`;
        if(!confirm(message))return false;
        if(!imported.files.some(f=>f.name==='main.laua' || f.name==='main.luau'))imported.files.unshift({name:'main.laua',source:''});
        for(const file of projectFiles.values()){
          file.disposeChange.dispose();file.model.dispose();file.output.dispose();

        projectFiles.clear();activeFile=null;
        diffSnapshots.length=0;
        for(const entry of imported.files)createProjectFile(entry.name,entry.source,{silent:true});
        switchProjectFile(initialProjectFile());
        lintAllProjectFiles();rememberProject();
        projectStatus().textContent=`Imported ${imported.files.length} ${imported.hasEditableSources?'editable sources':'compiled Luau modules'}.`;
        projectStatus().className='ok';
        return true;
      }

      // Insert the matching block ending when Enter is pressed on a header.
      // Unlike a plain snippet, this respects the existing auto-closed `)`
      // after e.g. Connect(function()) and avoids adding an extra `)`.
      function lauaBlockClosingPlan(before, after, following) {
        if (!before.trim() || after.trim() && !/^\)+\s*$/.test(after)) return null;
        // A following `end` may belong to the surrounding class/function.
        // Existing endings are checked against the current header's scope below.
        const header = before.trim();
        let closing = null;
        if (/\b(?:async\s+)?function\s*(?:[A-Za-z_]\w*(?:[.:][A-Za-z_]\w*)?\s*)?\([^()]*\)\s*(?::\s*[A-Za-z_][\w?.{}<>| ]*)?$/.test(header) ||
            /^(?:(?:public|private|protected|static|override|abstract|final)\s+)*constructor\s*\([^()]*\)\s*(?::\s*[^\n]+)?$/.test(header) ||
            /^(?:(?:public|private|protected|static|override|abstract|final)\s+)*(?:get|set|watch)\s+[A-Za-z_]\w*\s*\([^()]*\)\s*(?::\s*[^\n]+)?$/.test(header)) closing = "end";
        else if (/^(?:export\s+)?(?:(?:abstract|final)\s+)?(?:class|namespace|enum|schema)\b\s+[A-Za-z_]\w*(?:\s+extends\s+[A-Za-z_]\w*)?\s*$/.test(header)) closing = "end";
        else if (/^match\b.+$/.test(header) || /^if\b.+\bthen\s*$/.test(header) ||
                 /^for\b.+\bdo\s*$/.test(header) || /^while\b.+\bdo\s*$/.test(header) ||
                 /^do\s*$/.test(header)) closing = "end";
        if (!closing) return null;
        if (closing === "end" && /\bfunction\s*\([^()]*\)\s*$/.test(header) &&
            /\b(?:Connect|Once|ConnectParallel|spawn|defer|delay|wrap|pcall|xpcall)\s*\(\s*function\s*\(/.test(header)) {
          if (!after.trim().startsWith(")")) closing = "end)";
        } else if (closing === "end" && /\bfunction\s*\([^()]*\)\s*$/.test(header) &&
                   /\b(?:[A-Za-z_]\w*(?:[.:][A-Za-z_]\w*)?)\s*\(\s*function\s*\(/.test(header)) {
          if (!after.trim().startsWith(")")) closing = "end)";
        }

      // An outer scope's `end` must not be mistaken for the ending of the
      // declaration being typed. This matters when a method is inserted above
      // the existing `end` of a class, namespace, function, or conditional.
      function lauaHasOwnClosingLine(model, headerLine, headerIndent) {
        const indentation = line => {
          const prefix = /^\s*/.exec(line)?.[0] || "";
          const tabWidth = model.getOptions().tabSize || 4;
          return [...prefix].reduce((width, character) => width + (character === "\t" ? tabWidth : 1), 0);
        };
        const headerWidth = indentation(headerIndent);
        // The regular block matcher handles nested bodies. Its result only
        // counts when the closing line is at or inside this header's indent.
        // Without this check, `class ... end` swallows a new method's `end`.
        try {
          const headerOffset = model.getOffsetAt({lineNumber: headerLine, column: 1});
          const existing = findMatchingEndByLines(model.getValue(), headerOffset);
          if (existing.start > headerOffset) {
            const closingRow = model.getLineContent(model.getPositionAt(existing.start).lineNumber);
            if (/^\s*end\b/.test(closingRow) && indentation(closingRow) >= headerWidth) return true;
          }
        } catch { /* A newly typed block may not have a closing line yet. */ }
        // `end)` (and similar callback closers) are not seen by the general
        // block matcher. Inspect sibling-level lines without crossing out of
        // the current scope or mistaking another declaration for our closer.
        for (let number = headerLine + 1; number <= model.getLineCount(); number++) {
          const row = model.getLineContent(number);
          const trimmed = row.trim();
          if (!trimmed || trimmed.startsWith("--")) continue;
          const width = indentation(row);
          if (width < headerWidth) return false;
          if (width === headerWidth) return /^end(?:\b|\))/.test(trimmed);
        }
        return false;
      }
      function tryAutoCloseLauaBlock() {
        const selection = lauaEditor.getSelection();
        const model = lauaEditor.getModel();
        if (!model || model.getLanguageId() !== "laua" || !selection?.isEmpty()) return false;
        const position = lauaEditor.getPosition();
        const line = model.getLineContent(position.lineNumber);
        const before = line.slice(0, position.column - 1);
        const after = line.slice(position.column - 1);
        const following = position.lineNumber < model.getLineCount() ? model.getLineContent(position.lineNumber + 1) : "";
        const closing = lauaBlockClosingPlan(before, after, following);
        if (!closing) return false;
        // A closing `end` further down may belong to the enclosing class,
        // namespace, if, or function. Only avoid insertion for this block's
        // own ending, including a callback's existing `end)`.
        const lineIndent = /^\s*/.exec(line)?.[0] || "";
        if (lauaHasOwnClosingLine(model, position.lineNumber, lineIndent)) return false;
        const options = model.getOptions();
        const tab = options.insertSpaces ? " ".repeat(options.tabSize || 4) : "\t";
        const eol = model.getEOL();

          text: `${eol}${lineIndent}${tab}${eol}${lineIndent}${closing}`, forceMoveMarkers: true}]);
        lauaEditor.setPosition({lineNumber: position.lineNumber + 1, column: lineIndent.length + tab.length + 1});
        lauaEditor.pushUndoStop();
        return true;
      }
      lauaEditor.onKeyDown(event => {
        if (event.keyCode !== monaco.KeyCode.Enter || event.ctrlKey || event.altKey || event.metaKey || event.shiftKey) return;
        if (tryAutoCloseLauaBlock()) { event.preventDefault(); event.stopPropagation(); }

      const luauEditor = monaco.editor.create(document.getElementById("luauEditor"), {
        value: "",

      const status = document.getElementById("status");

      const refreshApiButton = document.getElementById("refreshApiBtn");

      function showRobloxApiStatus(loaded) {
        if (!loaded) {
          apiStatus.textContent = "Roblox API: unavailable — offline core autocomplete active; full Studio method coverage requires Refresh API";
          apiStatus.className = "error";
          return;
        }
        const verification = verifyRobloxApiDatabase();
        const isOfficial = ROBLOX_API.source === "Roblox current Studio API dump";
        const version = ROBLOX_API.version ? ` ${ROBLOX_API.version}` : "";
        const origin = isOfficial ? `current Studio${version}` : "mirror (freshness unverified)";
        apiStatus.textContent = `Roblox API: ${origin} · ${ROBLOX_API.stats.classes} classes, ${ROBLOX_API.stats.members} members, ${ROBLOX_API.stats.enums} enums · datatype constructors bundled${verification.ok ? "" : " · verification warnings"}`;
        apiStatus.className = verification.ok && isOfficial ? "ok" : verification.ok ? "" : "error";
        apiStatus.title = verification.ok ? "Constructor globals come from the bundled datatype catalog; engine classes and enums come from the API dump." : verification.problems.join(" | ");
      }

      refreshApiButton.addEventListener("click", async () => {
        refreshApiButton.disabled = true;
        apiStatus.textContent = "Roblox API: checking latest Studio version...";
        apiStatus.className = "";
        try {
          const loaded = await ensureRobloxApiLoaded(true);
          showRobloxApiStatus(loaded);
          refreshEditorIntelligence();
        } finally {
          refreshApiButton.disabled = false;
        }
      });

      status.textContent = "Loading full Roblox API autocomplete...";

      ensureRobloxApiLoaded().then(loaded => {
        showRobloxApiStatus(loaded);
        if (loaded) {
          const verification = verifyRobloxApiDatabase();

          if (verification.ok) {
            const versionText = ROBLOX_API.version
              ? ` · Studio ${ROBLOX_API.version}`

            status.textContent =
              `Ready · ${ROBLOX_API.source === "Roblox current Studio API dump" ? "current Studio API" : "API mirror (freshness unverified)"}${versionText} · ` +
              `${ROBLOX_API.stats.classes} classes · ` +
              `${ROBLOX_API.stats.members} usable members · ` +
              `${ROBLOX_API.stats.deprecatedFiltered} deprecated filtered`;

            status.className = "ok";

            status.textContent =
              "API loaded but verification found: " +

            "Roblox API database unavailable — engine API autocomplete is not verified";

      function runTranspilerSelfTests() {
        // Constructor globals must not disappear after loading the engine dump.
        const instanceStatic = getRobloxDatatypeStaticMembers("Instance");
        if (!instanceStatic?.new || !instanceStatic?.fromExisting) throw new Error("Missing Instance datatype constructors");
        const cfStatic = getRobloxDatatypeStaticMembers("CFrame");
        if (!cfStatic?.lookAt || !cfStatic?.Angles) throw new Error("Missing CFrame constructors");
        const tests = [
          {
            name: "new without args",
            source: "class myClass\nend\nlocal thing = new myClass",
            expected: "local thing = myClass.new()"
          },
          {
            name: "new with args",
            source: "class myClass\n\tconstructor(value)\n\t\tself.Value = value\n\tend\nend\nlocal thing = new myClass(5)",
            expected: "local thing = myClass.new(5)"
          },
          {
            name: "final class",
            source: "final class Locked\nend\nclass Derived extends Locked\nend",
            expected: "Cannot extend final class"
          },
          {
            name: "get setter",
            source: "class Player\n get Score()\n return 4\n end\n set Score(value)\n print(value)\n end\nend",
            expected: "Player.__getters.Score = function(self)"
          },
          {
            name: "defer scope",
            source: "local function demo()\n defer\n print(1)\n end\n return 5\nend",
            expected: "table.pack(xpcall(function()"
          },
          {
            name: "async and await",
            source: "async function Fetch()\n    return await Get()\nend",
            expected: "return __lauaAsync.run(function()"
          },
          {
            name: "using cleanup",
            source: "local function Work()\n    using conn = event:Connect(handler)\nend",
            expected: "conn:Disconnect()"
          },
          {
            name: "async method",
            source: "class Client\n    async function Run()\n        return await Get()\n    end\nend",
            expected: "function Client:Run()"
          },
          { name: "class check", source: "class A\nend\nlocal a = new A\nprint(a is A)", expected: "__lauaCore.is(a, A)" },
          { name: "pipeline", source: "local out = 5 |> Double |> tostring", expected: "tostring(Double(5))" },
          { name: "memo function", source: "memo function Twice(a)\n return a * 2\nend", expected: "Twice = __lauaCore.memo(Twice)" },
          { name: "optional index", source: "local value = data?.[index]", expected: "__lauaCore.optionalIndex(data, function() return index end)" },
          { name: "default argument", source: "function F(a = 10)\n return a\nend", expected: "if a == nil then a = 10 end" },
          { name: "optional callback invocation", source: "local result = callback?.(1, 2)", expected: "__lauaCore.optionalCall(callback, function(__lauaReceiver) return __lauaReceiver(1, 2) end)" },
          { name: "Instance missing member safety", source: "local result = instance?.NoSuchMember", expected: 'if typeof(value) == "Instance" then' },
          { name: "optional callback arguments lazy", source: "local result = maybe?.(Expensive())", expected: "return __lauaReceiver(Expensive()) end" },
          {
            name: "normal Luau .new",
            source: "local part = Instance.new(\"Part\")",
            expected: "Instance.new(\"Part\")"
          }
        ];

        for (const test of tests) {
          const output = transpile(test.source);

          if (!output.includes(test.expected)) {
            throw new Error(`Self-test failed: ${test.name}`);
          }
        }

        return true;
      }


      const diagnosticsTimer = { id: null };

      function refreshEditorIntelligence() {
        clearTimeout(diagnosticsTimer.id);

        diagnosticsTimer.id = setTimeout(() => {
          lintAllProjectFiles();
