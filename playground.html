<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Laua Playground</title>
  <link id="lauaFavicon" rel="icon" type="image/png" href="https://raw.githubusercontent.com/Thegreatestprogrammerthatseverlived/laua/main/logo.png?v=laua-20261013-icon3" />
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/Thegreatestprogrammerthatseverlived/laua/main/logo.png?v=laua-20261013-icon3" />
  <meta name="theme-color" content="#151922" />
  <script>
    // Make the tab icon fill the available space by trimming transparent padding.
    // The original GitHub image remains the fallback if canvas or CORS is blocked.
    (() => {
      const source = new Image();
      source.crossOrigin = 'anonymous';
      source.onload = () => {
        try {
          const canvas = document.createElement('canvas');
          const width = source.naturalWidth;
          const height = source.naturalHeight;
          if (!width || !height || width * height > 16000000) return;
          canvas.width = width;
          canvas.height = height;
          const context = canvas.getContext('2d', { willReadFrequently: true });
          if (!context) return;
          context.drawImage(source, 0, 0);
          const data = context.getImageData(0, 0, width, height).data;
          let minX = width;
          let minY = height;
          let maxX = -1;
          let maxY = -1;
          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              if (data[(y * width + x) * 4 + 3] < 24) continue;
              if (x < minX) minX = x;
              if (y < minY) minY = y;
              if (x > maxX) maxX = x;
              if (y > maxY) maxY = y;
            }
          }
          if (maxX < minX || maxY < minY) return;
          const boundedWidth = maxX - minX + 1;
          const boundedHeight = maxY - minY + 1;
          const size = 128;
          const padding = 2;
          const scale = (size - padding * 2) / Math.max(boundedWidth, boundedHeight);
          const target = document.createElement('canvas');
          target.width = size;
          target.height = size;
          const targetContext = target.getContext('2d');
          if (!targetContext) return;
          targetContext.imageSmoothingEnabled = true;
          targetContext.imageSmoothingQuality = 'high';
          targetContext.drawImage(source, minX, minY, boundedWidth, boundedHeight,
            (size - boundedWidth * scale) / 2,
            (size - boundedHeight * scale) / 2,
            boundedWidth * scale, boundedHeight * scale);
          const favicon = document.getElementById('lauaFavicon');
          if (favicon) favicon.href = target.toDataURL('image/png');
        } catch (_) {
          // If the image cannot be read, keep the normal favicon.
        }
      };
      source.src = document.getElementById('lauaFavicon').href;
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: Inter, system-ui, Arial, sans-serif; background: #0f1115; color: #f4f4f5; }
    body { display: flex; flex-direction: column; }
    header {
      height: 58px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px; border-bottom: 1px solid #2a2f3a; background: #151922;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand h1 { margin: 0; font-size: 20px; }
    .brand span { color: #9aa4b2; font-size: 13px; }
    .actions { display: flex; gap: 8px; }
    button {
      border: 1px solid #343b49; border-radius: 8px; background: #232936; color: #f4f4f5;
      padding: 8px 13px; cursor: pointer; font-weight: 600;
    }
    button:hover { background: #2b3342; }
    .github-btn {
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid #343b49; border-radius: 8px; background: #232936;
      color: #f4f4f5; padding: 8px 13px; font-size: 13px; font-weight: 600;
      text-decoration: none; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .github-btn:hover { background: #2b3342; }
    .github-btn:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
    .mode-label { display:flex; align-items:center; gap:6px; font-size:12px; color:#cbd5e1; }
    select { background:#232936; border:1px solid #343b49; border-radius:7px; color:#f4f4f5; padding:7px; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    #transpileBtn { background: #2563eb; border-color: #2563eb; }
    #transpileBtn:hover { background: #1d4ed8; }
    main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; }
    .pane { min-width: 0; display: flex; flex-direction: column; }
    .pane:first-child { border-right: 1px solid #2a2f3a; }
    .pane-title {
      height: 38px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; background: #151922; border-bottom: 1px solid #2a2f3a;
      color: #cbd5e1; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
    }
    .editor { flex: 1; min-height: 0; }
    #status {
      height: 30px; display: flex; align-items: center; padding: 0 12px;
      border-top: 1px solid #2a2f3a; background: #151922; color: #94a3b8; font-size: 12px;
    }
    dialog { width:min(950px,94vw); max-height:85vh; background:#161b26; border:1px solid #3a4557; border-radius:12px; color:#e5e7eb; }
    dialog::backdrop { background:rgba(0,0,0,.7); }
    #diffResult { max-height:65vh; overflow:auto; background:#0c1018; padding:14px; font-size:12px; white-space:pre; line-height:1.5; }

    /* v3.13 multi-file project workspace */
    /* Studio-friendly command bar: primary commands never wrap unexpectedly. */
    header { gap: 16px; position: relative; z-index: 30; flex-shrink: 0; }
    .brand { flex: 0 0 auto; min-width: 0; align-items: center; }
    .brand h1 { font-size: 18px; white-space: nowrap; flex-shrink: 0; }
    .brand span { white-space: nowrap; flex-shrink: 0; }
    .actions { flex: 1 1 auto; min-width: 0; flex-wrap: nowrap; justify-content: flex-end; align-items: center; gap: 7px; }
    .actions > button, .actions > label { flex-shrink: 0; white-space: nowrap; }
    .actions > button { padding: 7px 10px; }
    .actions > .github-btn { padding: 7px 10px; }
    .header-more { position: relative; flex-shrink: 0; }
    .header-more > summary { user-select: none; display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; cursor: pointer; border: 1px solid #343b49; border-radius: 8px; background: #232936; font-size: 13px; font-weight: 600; list-style: none; }
    .header-more > summary::-webkit-details-marker { display: none; }
    .header-more > summary:hover, .header-more[open] > summary { background: #2b3342; }
    .header-more > summary:focus-visible { outline: 2px solid #60a5fa; outline-offset: 2px; }
    .more-panel { position: absolute; right: 0; top: calc(100% + 9px); z-index: 100; width: min(315px, calc(100vw - 24px)); max-height: min(68vh, 560px); overflow-y: auto; border: 1px solid #3d4960; border-radius: 11px; padding: 9px; background: #191f2b; box-shadow: 0 18px 50px rgba(0,0,0,.55); display: grid; grid-template-columns: 1fr; gap: 5px; }
    .more-panel button { width: 100%; text-align: left; white-space: normal; font-size: 12px; padding: 10px 11px; }
    .more-section { color: #94a3b8; font-size: 10px; text-transform: uppercase; font-weight: 700; letter-spacing: .1em; padding: 7px 7px 3px; }
    @media (max-width: 1250px) { header { height: auto; min-height: 58px; flex-wrap: wrap; padding: 10px 12px; gap: 8px; } .brand { flex-basis: 100%; } .actions { justify-content: flex-start; width: 100%; flex-wrap: wrap; gap: 6px; } }
    @media (max-width: 760px) { .actions > button, .actions > .github-btn { padding: 7px 9px; } }
    @media (max-width: 440px) { .brand { flex-wrap: wrap; } }

    .file-tabs { display:flex; align-items:center; gap:3px; flex:1; min-width:0; overflow-x:auto; scrollbar-width:thin; }
    .file-tab { white-space:nowrap; display:inline-flex; align-items:center; gap:7px; background:transparent; color:#a6b3c6; border:1px solid transparent; border-bottom:2px solid transparent; border-radius:7px 7px 0 0; padding:7px 9px; font-size:12px; font-weight:500; }
    .file-tab:hover { background:#232b3b; }
    .file-tab.active { color:#f8fafc; background:#202739; border-color:#344155; border-bottom-color:#60a5fa; }
    .file-tab .file-error { color:#fca5a5; font-size:11px; }
    .file-tab .file-close { border:0; background:none; color:#94a3b8; padding:0 3px; font-size:16px; font-weight:400; line-height:1; }
    .file-tab .file-close:hover { color:white; background:#38465c; }
    .file-tab:focus-visible,.file-close:focus-visible { outline:2px solid #60a5fa; outline-offset:-2px; }
    .tab-add { flex:none; border-radius:6px; padding:5px 10px; font-size:16px; }
    .tab-action { font-size:11px; padding:5px 8px; flex:none; }
    .pane-title.has-tabs { height:auto; min-height:42px; text-transform:none; letter-spacing:normal; gap:8px; }
    .file-tools { display:flex; gap:5px; align-items:center; flex:none; }
    .filename-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; }
    .panel-subtitle { font-size:11px; color:#748297; letter-spacing:0; text-transform:none; }
    @media (max-width:1100px) { .file-tools .tab-action { padding:5px; } }
    #robloxApiStatus { background:#111827; color:#cbd5e1; font-size:12px; padding:6px 12px; border-top:1px solid #2a2f3a; white-space:normal; }
    .ok { color: #86efac !important; }
    .error { color: #fca5a5 !important; }
    @media (max-width: 850px) {
      header { height: auto; min-height: 58px; flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
      .actions { flex-wrap: wrap; }
      main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      .pane:first-child { border-right: 0; border-bottom: 1px solid #2a2f3a; }
    }
  
    .laua-callback-hint {
      display: flex; gap: 0.55rem; align-items: baseline;
      padding: 5px 9px; border: 1px solid #4a5174;
      border-radius: 6px; background: #181c2b; color: #e0e6ff;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
      box-shadow: 0 3px 12px #0007; max-width: min(560px, 80vw);
      pointer-events: none; white-space: nowrap; z-index: 20;
    }
    .laua-callback-hint strong { color: #bbadeb; font-weight: 600; }
    .laua-callback-hint .hint-params { overflow: hidden; text-overflow: ellipsis; }

  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Laua Playground</h1>
      <span>pronounced “lau-wuh”</span>
    </div>
    <div class="actions" role="toolbar" aria-label="Laua editor commands">
      <button id="lintBtn">Lint</button>
      <label class="mode-label" for="modeSelect">Mode
        <select id="modeSelect" aria-label="Laua compile mode">
          <option value="Development">Development</option>
          <option value="Release">Release</option>
          <option value="Debug">Debug</option>
        </select>
      </label>
      <label class="mode-label">Output

          <option value="Readable">Readable</option>
          <option value="Compact">Compact</option>
        </select>
      </label>
      <button id="transpileBtn">Transpile</button>
      <button id="forceTranspileBtn" title="Bypass lint and preflight errors; syntax/transpilation errors still stop output">Force Transpile</button>
      <button id="copyBtn" title="Copy generated Luau code">Copy Luau</button>
      <a id="githubBtn" class="github-btn" href="https://github.com/Thegreatestprogrammerthatseverlived/laua" target="_blank" rel="noopener noreferrer" title="Open Laua on GitHub">Github</a>
      <details class="header-more" id="headerMore">
        <summary aria-label="More Laua actions">More ▾</summary>
        <div class="more-panel">
          <span class="more-section">Project and files</span>
          <button id="exampleBtn" title="Load the built-in starter example into main.laua (other files stay unchanged)">Default main.laua</button>
          <button id="clearBtn">Clear</button>
          <button id="exportBtn" title="Export active file as Luau">Export Luau</button>
          <button id="exportProjectBtn" title="Export compiled ModuleScripts only; keep .laua sources separately">Export Project .rbxmx</button>
          <button id="exportStudioBtn" title="Export original Laua and Luau sources for Studio">Export Editable Studio .rbxmx</button>
          <button id="importProjectBtn" title="Import compiled modules or an editable Studio project">Import Project .rbxmx</button>
          <span class="more-section">Tools</span>
          <button id="refreshApiBtn" title="Fetch the latest Roblox Studio API dump again">Refresh Roblox API</button>
          <button id="testsBtn" title="Run compiler regression tests">Tests</button>
          <button id="diffBtn" title="Compare the last two successful manual transpiles">Output Diff</button>
          <a id="docsBtn" class="github-btn" href="https://github.com/Thegreatestprogrammerthatseverlived/laua/blob/main/docs/Documentation.md" target="_blank" rel="noopener noreferrer" title="Read the official Laua documentation on GitHub">Docs</a>
          <button id="nextErrorBtn" title="Jump to the next error or warning (F8)">Next Problem</button>
        </div>
      </details>
      <input id="importProjectInput" type="file" accept=".rbxmx,application/xml,text/xml" hidden />
    </div>
  </header>

  <main>
    <section class="pane">
      <div class="pane-title has-tabs">
        <div id="fileTabs" class="file-tabs" role="tablist" aria-label="Laua project files"></div>
        <div class="file-tools">
          <button id="newFileBtn" class="tab-add" title="New .laua file" aria-label="New .laua file">+</button>
          <button id="renameFileBtn" class="tab-action" title="Rename selected file">Rename</button>
          <button id="openFilesBtn" class="tab-action" title="Open .laua or .luau files from your computer">Open</button>
          <input id="openFilesInput" type="file" accept=".laua,.luau,text/plain" multiple hidden />
        </div>
      </div>
      <div id="lauaEditor" class="editor"></div>
    </section>

    <section class="pane">
      <div class="pane-title"><span>Luau Output</span><span id="outputFilename" class="filename-label">main.luau · read only</span></div>
      <div id="luauEditor" class="editor"></div>
    </section>
  </main>

  <div id="status" role="status" aria-live="polite">Loading Laua Playground...</div>
  <div id="robloxApiStatus" role="status" aria-live="polite" title="Engine classes and enums use the current Roblox Studio API dump (with fallbacks). Luau primitives, buffer, and standard libraries use the bundled catalog.">Roblox API: checking current Studio version...</div>
  <dialog id="diffDialog" aria-label="Generated output differences">
    <div style="display:flex;gap:14px;align-items:center;justify-content:space-between">
      <strong>Generated Luau changes</strong>
      <button id="closeDiffBtn">Close</button>
    </div>
    <pre id="diffResult"></pre>
  </dialog>

  <script>
    // The editor must not silently show an empty screen when a CDN is blocked.
    (function loadLauaMonacoLoader() {
      const urls = [
        "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js",
        "https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.min.js",
        "https://unpkg.com/monaco-editor@0.52.2/min/vs/loader.min.js"
      ];
      const status = document.getElementById("status");
      function load(index) {
        if (index >= urls.length) {
          status.textContent = "Could not load the code editor. Check your internet connection and refresh the page.";
          status.className = "error";
          return;
        }
        const loader = document.createElement("script");
        loader.src = urls[index];
        loader.onload = () => {
          if (typeof window.require === "function" && typeof window.require.config === "function") {
            window.__lauaMonacoAssetsUrl = urls[index].replace(/\/loader\.min\.js$/, "");
            window.dispatchEvent(new Event("laua-monaco-loader-ready"));
          } else {
            loader.remove();
            load(index + 1);
          }
        };
        loader.onerror = () => {
          loader.remove();
          load(index + 1);
        };
        document.head.appendChild(loader);
      }
      load(0);
    })();
  </script>
  <script>
    function initializeLauaPlayground() {
    // Laua language registry: a new contextual keyword is registered once here.
    // Highlighting, keyword suggestions, inline completion, hover text and lint
    // keyword recognition derive from this list. Runtime methods are discovered
    // from LAUA_CORE_RUNTIME_SOURCE instead of maintained as duplicate lists.
    // Grammar-changing features still require actual transpiler implementation.
    const LAUA_LANGUAGE_FEATURES = [
      ["class", "Declare a Laua class."],
      ["extends", "Inherit from another Laua class."],
      ["constructor", "Initialize a Laua instance."],
      ["private", "Class-only member visibility."],
      ["public", "Public class member visibility."],
      ["protected", "Inherited class member visibility."],
      ["static", "Declare a class-level member."],
      ["new", "Create a Laua class instance."],
      ["namespace", "Declare a Laua namespace."],
      ["super", "Access the parent class."],
      ["self", "Current instance within a Laua constructor or method."],
      ["abstract", "Declare an abstract class or member."],
      ["override", "Override an inherited method."],
      ["enum", "Declare a Laua enum."],
      ["final", "Prevent overriding a member."],
      ["get", "Declare a computed getter."],
      ["set", "Declare a computed setter."],
      ["defer", "Run cleanup when leaving the scope."],
      ["using", "Dispose a resource at scope exit."],
      ["async", "Declare an asynchronous function."],
      ["await", "Wait for an asynchronous result."],
      ["match", "Match against cases."],
      ["case", "Declare a match case."],
      ["default", "Declare a fallback match branch."],
      ["exhaustive", "Require every enum or boolean case to be handled."],
      ["import", "Load exports from another module."],
      ["from", "Identify an import module."],
      ["operator", "Declare an overloaded operator."],
      ["lazy", "Initialize a field on first access."],
      ["watch", "Respond when a watched field changes."],
      ["export", "Expose named declarations from a module."],
      ["as", "Rename a named import."],
      ["memo", "Memoize a function's results; memo.clear(fn) clears its cache, memo.clear() clears all."],
      ["is", "Check Laua class ancestry."],
      ["inline", "Request inline transpilation where supported."],
      ["const", "Declare an immutable binding."],
      ["schema", "Declare a runtime validation schema."],
    ];
    const LAUA_KEYWORDS = [...new Set(LAUA_LANGUAGE_FEATURES.map(([name]) => name))];
    const LAUA_KEYWORD_DOCS = Object.fromEntries(LAUA_LANGUAGE_FEATURES);

    const LUAU_ATTRIBUTES = [
      "@native",
      "@deprecated",
      "@nolint"
    ];

    const LUAU_DIRECTIVES = [
      "--!strict",
      "--!nonstrict",
      "--!nocheck",
      "--!native",
      "--!nolint",
      "--!optimize"
    ];


    const LUAU_KEYWORDS = [
      "and", "break", "continue", "do", "else", "elseif", "end",
      "false", "for", "function", "if", "in", "local", "nil", "not", "or",
      "repeat", "return", "then", "true", "type", "export", "until", "while", "const"
    ];

    // Monaco autocomplete catalogs. Each item here is an actual Luau/Laua
    // keyword, type, built-in, engine global, or datatype constructor.
    // Engine classes are added separately when the cursor expects a type.
    const LUAU_GLOBAL_FUNCTIONS = [
      "assert", "collectgarbage", "error", "gcinfo", "getfenv", "getmetatable",
      "ipairs", "loadstring", "newproxy", "next", "pairs", "pcall", "print",
      "rawequal", "rawget", "rawlen", "rawset", "require", "select", "setfenv",
      "setmetatable", "tonumber", "tostring", "type", "typeof", "unpack", "xpcall",
      "DebuggerManager", "delay", "elapsedTime", "PluginManager", "printidentity",
      "settings", "spawn", "stats", "tick", "time", "UserSettings", "version",
      "wait", "warn", "ypcall"
    ];

    const LUAU_GLOBAL_OBJECTS = [
      "_G", "shared", "game", "workspace", "script", "plugin", "Enum"
    ];

    const LUAU_LIBRARIES = [
      "math", "table", "string", "task", "coroutine", "utf8", "os", "bit32",
      "buffer", "debug"
    ];

    // Roblox Studio engine datatype catalog (type names, not necessarily constructors).
    // Keep values like Secret and RBXScriptSignal type-only: they cannot all be .new()'d.
    const LUAU_BUILTIN_TYPES = [
      "AdReward", "Axes", "BrickColor", "CatalogSearchParams", "CFrame", "Collection",
      "Color3", "ColorSequence", "ColorSequenceKeypoint", "Content", "DateTime",
      "DockWidgetPluginGuiInfo", "Enum", "EnumItem", "Enums", "Faces", "FloatCurveKey",
      "Font", "Instance", "NumberRange", "NumberSequence", "NumberSequenceKeypoint",
      "OverlapParams", "Path2DControlPoint", "PathWaypoint", "PhysicalProperties",
      "Random", "Ray", "RaycastParams", "RaycastResult", "RBXScriptConnection",
      "RBXScriptSignal", "Rect", "Region3", "Region3int16", "RotationCurveKey",
      "Secret", "SecurityCapabilities", "SharedTable", "TweenInfo", "UDim", "UDim2",
      "User", "ValueCurveKey", "Vector2", "Vector2int16", "Vector3", "Vector3int16"
    ];

    const LUAU_RUNTIME_CONSTRUCTORS = LUAU_BUILTIN_TYPES.filter(name =>
      ["Axes", "BrickColor", "CFrame", "Color3", "ColorSequence", "DateTime", "Faces", "Font", "Instance", "NumberRange", "NumberSequence", "NumberSequenceKeypoint", "OverlapParams", "PhysicalProperties", "Random", "Ray", "RaycastParams", "Rect", "Region3", "TweenInfo", "UDim", "UDim2", "Vector2", "Vector3", "Vector3int16", "Vector2int16"].includes(name)
    );

    // Type names are suggestions, not runtime globals. Include all directly
    // spellable Luau type keywords (vector is intentionally not a type name).
    const LUAU_TYPE_WORDS = [
      "any", "unknown", "never", "nil", "boolean", "number", "string", "thread", "buffer"
    ];

    const LUAU_GLOBAL_CONSTANTS = ["_VERSION"];
    const LAUA_GLOBAL_FUNCTIONS = ["cancelScope"];
    const LUAU_GLOBALS = [...new Set([
      ...LUAU_GLOBAL_FUNCTIONS,
      ...LUAU_GLOBAL_OBJECTS,
      ...LUAU_LIBRARIES,
      ...LUAU_RUNTIME_CONSTRUCTORS,
      ...LUAU_GLOBAL_CONSTANTS
    ])];

    const LUAU_DEPRECATED_GLOBALS = new Set([
      "collectgarbage", "getfenv", "setfenv", "DebuggerManager", "PluginManager",
      "delay", "elapsedTime", "printidentity", "spawn", "version", "wait", "ypcall"
    ]);
    // Default/common direct DataModel children, not an arbitrary list of
    // all API classes with the Service tag.
    const ROBLOX_GAME_CHILDREN = [
      "Workspace", "Players", "Lighting", "ReplicatedStorage", "ReplicatedFirst",
      "ServerScriptService", "ServerStorage", "StarterGui", "StarterPack",
      "StarterPlayer", "SoundService", "Teams", "Chat", "TextChatService",
      "MaterialService", "Terrain", "TestService"
    ];
    const ROBLOX_SERVICES = [
      "Players", "RunService", "UserInputService", "ContextActionService",
      "ReplicatedStorage", "ServerStorage", "ServerScriptService",
      "StarterGui", "StarterPlayer", "TweenService", "CollectionService",
      "HttpService", "DataStoreService", "MemoryStoreService", "MessagingService",
      "TeleportService", "PathfindingService", "PhysicsService", "Debris",
      "MarketplaceService", "BadgeService", "LocalizationService", "Lighting",
      "SoundService", "TextService", "GuiService", "Teams", "Chat",
      "AssetService", "InsertService", "ProximityPromptService"
    ];

    const LIBRARY_MEMBERS = {
      math: [
        "abs", "acos", "asin", "atan", "atan2", "ceil", "clamp", "cos",

          detail: definition?.[1] || (LAUA_CORE_AVAILABLE.has(`${owner}.${name}`)

    function makeBufferCallSuggestions(monacoApi, model, position, owner, typedPartial, lineBefore) {
      const dotMatch = lineBefore.match(/([A-Za-z_]\w*)\s*\.\s*([A-Za-z_]\w*)?$/);

      const replacementStart = position.column - dotMatch[0].length;
      const range = new monacoApi.Range(position.lineNumber, replacementStart, position.lineNumber, position.column);

      for (const [name, [signature, documentation, acceptsBuffer]] of Object.entries(BUFFER_SIGNATURES)) {
        if (!acceptsBuffer || !name.toLowerCase().startsWith(typedPartial.toLowerCase())) continue;

          const label = entry.split(":")[0].replace(/\?$/, "");

          kind: monacoApi.languages.CompletionItemKind.Function,

          documentation: `${documentation}\n\nBuffer values do not have methods. The result uses the global buffer library.`,

-- Laua examples
local numbers = {1, 2, 3}

    const PREVIOUS_MAIN_STARTER = "import Zombie from \"./Zombie\"\nimport Player from \"./Player\"\n\nlocal zombie = new Zombie\nlocal player = new Player\nprint(zombie.Health, player.Name)";

    // All source-location offsets are UTF-16 indices, matching Monaco models.
    // Preserve diagnostics already located by the semantic analyzer.
    function locatedLauaError(error, source, offset, tokenLength = 1) {
      if (Number.isInteger(error.offset)) return error;
      const at = Math.max(0, Math.min(source.length, offset));
      const lineStart = source.lastIndexOf("\n", at - 1) + 1;
      error.offset = at;
      error.endOffset = Math.min(source.length, at + Math.max(1, tokenLength));
      error.line = source.slice(0, at).split("\n").length;

    function normalizeBlockIndent(source, indent = "    ") {

      let smallestIndent = Infinity;

      for (const line of lines) {
        if (line.trim() === "") continue;

        if (leading < smallestIndent) smallestIndent = leading;

    const ROBLOX_API = {
      ready: false,
      failed: false,
      verified: false,
      version: null,
      source: null,
      classes: new Map(),
      enums: new Map(),
      services: new Set(),
      stats: {
        classes: 0,
        members: 0,
        enums: 0,
        enumItems: 0,
        deprecatedFiltered: 0,
        notScriptableFiltered: 0,
        restrictedFiltered: 0
      }
    };

    function robloxTypeName(type) {
      if (!type) return null;
      if (typeof type === "string") return type;
      return type.Name || type.name || null;
    }

    function robloxTags(descriptor) {
      return Array.isArray(descriptor?.Tags)
        ? descriptor.Tags
        : [];
    }

    function hasRobloxTag(descriptor, tagName) {
      return robloxTags(descriptor).some(tag =>
        typeof tag === "string" && tag === tagName
      );
    }

    function isRobloxDeprecated(descriptor) {
      if (!descriptor) return false;

      if (descriptor.Deprecated === true) return true;

      if (
        typeof descriptor.DeprecationMessage === "string" &&
        descriptor.DeprecationMessage.trim() !== ""
      ) {
        return true;
      }

      for (const tag of robloxTags(descriptor)) {
        if (tag === "Deprecated" || (tag && typeof tag === "object" && (tag.Name === "Deprecated" || tag.Tag === "Deprecated"))) return true;

        // Current API dumps can encode a deprecated alias as a tag object
        // pointing to the preferred replacement descriptor.
        if (
          tag &&
          typeof tag === "object" &&
          (
            typeof tag.PreferredDescriptorName === "string" ||
            typeof tag.PreferredDescriptor === "string"
          )
        ) {
          return true;
        }
      }

      return false;
    }

    function isRobloxNotScriptable(descriptor) {
      return hasRobloxTag(descriptor, "NotScriptable");
    }

    // Roblox's dump includes API members visible in different execution
    // environments. Suggest public, Studio-plugin, and local-command members
    // while labeling their access level; never pretend internal engine APIs
    // are callable from normal scripts.
    function isNormalScriptSecurity(value) {
      return value == null || value === "None" || value === "PluginSecurity" ||
        value === "LocalUserSecurity";
    }

    function robloxMemberAccessNote(member) {
      const security = member?.Security;
      const levels = typeof security === "object" && security !== null
        ? [security.Read, security.Write]
        : [security];
      if (levels.includes("PluginSecurity")) return "Studio plugin/editor access";
      if (levels.includes("LocalUserSecurity")) return "Studio command-bar access";
      if (member?.Name === "Source" && member?.MemberType === "Property") {
        return "Script source (not accessible from running game scripts)";
      }
      return "";
    }

    function isRobloxMemberAccessible(member) {
      if (!member) return false;

      const security = member.Security;

      if (member.MemberType === "Property") {
        if (!security || typeof security !== "object") return true;

        // A property is worth suggesting if a normal game script can
        // either read it or write it.
        return (
          isNormalScriptSecurity(security.Read) ||
          isNormalScriptSecurity(security.Write)
        );
      }

      return isNormalScriptSecurity(security);
    }

    function shouldExposeRobloxClass(classInfo) {
      if (!classInfo?.Name) return false;
      if (isRobloxDeprecated(classInfo)) return false;
      if (isRobloxNotScriptable(classInfo)) return false;
      return true;
    }

    function shouldExposeRobloxMember(member) {
      if (!member?.Name || /^__/.test(member.Name)) return false;

      // Keep deprecated callable APIs discoverable, clearly labeled. The
      // completion list still excludes non-scriptable/internal methods.
      if (isRobloxNotScriptable(member)) {
        ROBLOX_API.stats.notScriptableFiltered += 1;
        return false;
      }

      if (!isRobloxMemberAccessible(member)) {
        ROBLOX_API.stats.restrictedFiltered += 1;
        return false;
      }

      return true;
    }

    function shouldExposeRobloxEnum(enumInfo) {
      if (!enumInfo?.Name) return false;
      if (isRobloxDeprecated(enumInfo)) return false;
      return true;
    }

    function shouldExposeRobloxEnumItem(item) {
      if (!item?.Name) return false;
      if (isRobloxDeprecated(item)) return false;
      return true;
    }

    function robloxMemberKind(member) {
      if (!member) return "field";

      if (member.MemberType === "Function") return "function";
      if (member.MemberType === "Callback") return "function";
      if (member.MemberType === "Event") return "event";

      return "field";
    }

    function robloxMemberDetail(className, member) {
      const type = member.MemberType || "Member";
      const valueType =
        robloxTypeName(member.ValueType) ||
        robloxTypeName(member.ReturnType);

      const note = robloxMemberAccessNote(member);
      const deprecated = isRobloxDeprecated(member) ? " · deprecated" : "";
      const base = valueType
        ? `${className} ${type.toLowerCase()} · ${valueType}`
        : `${className} ${type.toLowerCase()}`;
      return `${base}${note ? ` · ${note}` : ""}${deprecated}`;
    }

    function robloxFunctionParams(member) {
      if (!Array.isArray(member.Parameters)) return "";

      return member.Parameters.map(parameter => {
        const name = parameter.Name || "value";
        const typeName = robloxTypeName(parameter.Type);

        return typeName ? `${name}: ${typeName}` : name;
      }).join(", ");
    }

    function robloxMemberReturnClass(member) {
      const type =
        member.ValueType ||
        member.ReturnType ||
        (Array.isArray(member.ReturnType) ? member.ReturnType[0] : null);

      if (Array.isArray(member.ReturnType) && member.ReturnType.length > 0) {
        return robloxTypeName(member.ReturnType[0]);
      }

      const category = type?.Category;
      const name = robloxTypeName(type);

      if (category === "Class") return name;
      if (name && (ROBLOX_API.classes.has(name) || ROBLOX_DATATYPE_STATIC[name] || BUILTIN_MEMBER_SETS[name])) return name;

      return null;
    }

    function getRobloxClassInfo(className) {
      return ROBLOX_API.classes.get(className) || null;
    }

    const apiMemberCache = new Map();
    function getRobloxApiMembers(className, seen = new Set()) {
      if (!className || seen.has(className)) return {};
      if (apiMemberCache.has(className)) return apiMemberCache.get(className);

      const classInfo = getRobloxClassInfo(className);
      if (!classInfo) return {};

      seen.add(className);

      const inherited = classInfo.Superclass
        ? getRobloxApiMembers(classInfo.Superclass, seen)
        : {};

      const own = {};

      for (const member of classInfo.Members || []) {
        if (!shouldExposeRobloxMember(member)) continue;

        const memberName = member.Name;
        if (!memberName) continue;

        own[memberName] = {
          kind: robloxMemberKind(member),
          params: robloxFunctionParams(member),
          detail: robloxMemberDetail(className, member),
          returnClass: member.MemberType === "Event" ? "RBXScriptSignal" : robloxMemberReturnClass(member),
          documentation: robloxMemberAccessNote(member) || undefined,
          apiMember: member,
          ownerClass: className
        };
      }

      // Roblox exposes this singleton child with dot access, even though it
      // does not appear as a declared UserSettings property in every API dump.
      // Keep the documented child mapping alongside live inherited members.
      if (className === "UserSettings") {
        own.GameSettings = {
          kind: "field",
          returnClass: "UserGameSettings",
          detail: "Documented UserSettings child · UserGameSettings"
        };
      }

      const result = {...inherited, ...own};
      apiMemberCache.set(className, result);
      return result;
    }

    function getRobloxEnumTypes() {
      const members = {};

      for (const [enumName, enumInfo] of ROBLOX_API.enums) {
        if (!shouldExposeRobloxEnum(enumInfo)) continue;

        members[enumName] = {
          kind: "enum",
          detail: "Roblox enum"
        };
      }

      return members;
    }

    function getRobloxEnumItems(enumName) {
      const enumInfo = ROBLOX_API.enums.get(enumName);
      if (!enumInfo || !shouldExposeRobloxEnum(enumInfo)) return {};

      const members = {};

      for (const item of enumInfo.Items || []) {
        if (!shouldExposeRobloxEnumItem(item)) continue;

        members[item.Name] = {
          kind: "enum",
          detail: `Enum.${enumName}`
        };
      }

      return members;
    }

    function getGameApiMembers() {
      const members = {
        ...getRobloxApiMembers("DataModel")
      };

      // The API contains hundreds of Service-tagged types, many of which
      // are not children of the DataModel. Never spill all class names into
      // game. completion: use the common DataModel children only. Every
      // available service remains discoverable via game:GetService("...").
      for (const serviceName of ROBLOX_GAME_CHILDREN) {
        if (!ROBLOX_API.services.has(serviceName)) continue;
        if (members[serviceName]) continue;
        members[serviceName] = {
          kind: "field",
          detail: `DataModel child service · ${serviceName}`,
          returnClass: serviceName
        };
      }

      // Keep the canonical Workspace alias visible even if dump metadata
      // changes how the class is tagged.
      members.Workspace = {
        kind: "field",
        detail: "Roblox service · Workspace",
        returnClass: "Workspace"
      };

      return members;
    }

    let robloxApiLoadPromise = null;

    function installRobloxApiDump(dump, metadata = {}) {
      apiMemberCache.clear();
      ROBLOX_API.classes.clear();
      ROBLOX_API.enums.clear();
      ROBLOX_API.services.clear();

      ROBLOX_API.stats = {
        classes: 0,
        members: 0,
        enums: 0,
        enumItems: 0,
        deprecatedFiltered: 0,
        notScriptableFiltered: 0,
        restrictedFiltered: 0
      };

      for (const classInfo of dump.Classes || []) {
        if (!shouldExposeRobloxClass(classInfo)) {
          if (isRobloxDeprecated(classInfo)) {
            ROBLOX_API.stats.deprecatedFiltered += 1;
          }

          if (isRobloxNotScriptable(classInfo)) {
            ROBLOX_API.stats.notScriptableFiltered += 1;
          }

          continue;
        }

        ROBLOX_API.classes.set(classInfo.Name, classInfo);
        ROBLOX_API.stats.classes += 1;

        const tags = robloxTags(classInfo);

        // UserGameSettings is a service owned by the UserSettings singleton,
        // not by the DataModel returned by game:GetService().
        if ((tags.includes("Service") || classInfo.Name === "Workspace") &&
            classInfo.Name !== "UserGameSettings") {
          ROBLOX_API.services.add(classInfo.Name);
        }

        for (const member of classInfo.Members || []) {
          if (shouldExposeRobloxMember(member)) ROBLOX_API.stats.members += 1;
        }
      }

      for (const enumInfo of dump.Enums || []) {
        if (!shouldExposeRobloxEnum(enumInfo)) {
          if (isRobloxDeprecated(enumInfo)) {
            ROBLOX_API.stats.deprecatedFiltered += 1;
          }

          continue;
        }

        ROBLOX_API.enums.set(enumInfo.Name, enumInfo);
        ROBLOX_API.stats.enums += 1;

        for (const item of enumInfo.Items || []) {
          if (shouldExposeRobloxEnumItem(item)) {
            ROBLOX_API.stats.enumItems += 1;
          } else if (isRobloxDeprecated(item)) {
            ROBLOX_API.stats.deprecatedFiltered += 1;
          }
        }
      }

      ROBLOX_API.version = metadata.version || null;
      ROBLOX_API.source = metadata.source || null;
      ROBLOX_API.ready =
        ROBLOX_API.classes.size > 0 &&
        ROBLOX_API.enums.size > 0;
      ROBLOX_API.failed = !ROBLOX_API.ready;

      return ROBLOX_API.ready;
    }

    async function fetchJson(url, forceRefresh = false) {
      const response = await fetch(url, {
        // Roblox's versioned Studio dump is several MB. Cache it rather than
        // downloading the entire class catalog again on every page load.
        cache: forceRefresh ? "reload" : "default",
        mode: "cors"
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status} from ${url}`);
      }

      return response.json();
    }

    async function loadRobloxApiDump(force = false) {
      if (ROBLOX_API.ready && !force) return true;

      let lastError = null;

      // First use Roblox's current Studio version and official API dump.
      try {
        const versionData = await fetchJson(
          "https://clientsettingscdn.roblox.com/v2/client-version/WindowsStudio64", force
        );

        if (versionData?.clientVersionUpload) {
          const dump = await fetchJson(
            `https://setup.rbxcdn.com/${versionData.clientVersionUpload}-API-Dump.json`, force
          );

          if (installRobloxApiDump(dump, {
            version: versionData.version || versionData.clientVersionUpload,
            source: "Roblox current Studio API dump"
          })) return true;
        }
      } catch (error) {
        lastError = error;
      }

      // Then try mirrors.
      for (const url of ROBLOX_API_FALLBACK_URLS) {
        try {
          const dump = await fetchJson(url, force);

          if (installRobloxApiDump(dump, {
            version: null,
            source: "Roblox Client Tracker fallback"
          })) return true;
        } catch (error) {
          lastError = error;
        }
      }

      ROBLOX_API.ready = false;
      ROBLOX_API.failed = true;

      console.warn("Could not load Roblox API dump:", lastError);
      return false;
    }

    function verifyRobloxApiDatabase() {
      const problems = [];

      if (!ROBLOX_API.ready) {
        problems.push("API database is not loaded.");
        return {
          ok: false,
          problems
        };
      }

      if (!ROBLOX_API.classes.has("DataModel")) {
        problems.push("DataModel class is missing.");
      }

      if (!ROBLOX_API.classes.has("Instance")) {
        problems.push("Instance class is missing.");
      }
      // These representative inherited call chains must resolve like Studio.
      for (const [className, methods] of [
        ["UserSettings", ["GetService"]],
        ["Players", ["GetPlayers"]],
        ["DataModel", ["GetService"]],
        ["Script", ["Destroy"]]
      ]) {
        if (!ROBLOX_API.classes.has(className)) {
          problems.push(`${className} class is missing.`);
          continue;
        }
        const available = getRobloxApiMembers(className);
        for (const method of methods) {
          if (available[method]?.kind !== "function") problems.push(`${className}.${method} not available in loaded API.`);
        }
      }

      const instanceConstructors = getRobloxDatatypeStaticMembers("Instance");
      if (!instanceConstructors?.new || !instanceConstructors?.fromExisting) {
        problems.push("Instance datatype constructors are missing.");
      }

      if (!ROBLOX_API.enums.has("KeyCode")) {
        problems.push("KeyCode enum is missing.");
      }

      const gameMembers = getGameApiMembers();

      if (!gameMembers.GetService) {
        problems.push("game.GetService is missing.");
      }

      if (!gameMembers.Workspace) {
        problems.push("game.Workspace is missing.");
      }
      const scriptMembers = getRobloxApiMembers("Script");
      if (!scriptMembers.Source) problems.push("Script.Source is missing from loaded API.");

      for (const [className, classInfo] of ROBLOX_API.classes) {
        if (isRobloxDeprecated(classInfo)) {
          problems.push(`Deprecated class leaked into autocomplete: ${className}`);
          break;
        }

        const exposed = getRobloxApiMembers(className);

        for (const member of classInfo.Members || []) {
          if (
            (isRobloxNotScriptable(member) || !isRobloxMemberAccessible(member)) &&
            exposed[member.Name]?.apiMember === member
          ) {
            problems.push(`Filtered member leaked into autocomplete: ${className}.${member.Name}`);
            break;
          }
        }

        if (problems.length > 0) break;
      }

      // These counts are sanity checks for a real modern dump rather than
      // a tiny or malformed response.
      if (ROBLOX_API.stats.classes < 500) {
        problems.push(`Only ${ROBLOX_API.stats.classes} classes loaded.`);
      }

      if (ROBLOX_API.stats.members < 3000) {
        problems.push(`Only ${ROBLOX_API.stats.members} usable members loaded.`);
      }

      ROBLOX_API.verified = problems.length === 0;

      return {
        ok: ROBLOX_API.verified,
        problems
      };
    }

    function ensureRobloxApiLoaded(force = false) {
      if (ROBLOX_API.ready && !force) return Promise.resolve(true);
      // Avoid re-fetching megabytes after a failed load on every keystroke.
      // The Refresh API button explicitly retries with force=true.
      if (ROBLOX_API.failed && !force) return Promise.resolve(false);

      if (!robloxApiLoadPromise) {
        robloxApiLoadPromise = loadRobloxApiDump(force).finally(() => {
          robloxApiLoadPromise = null;
        });
      }

      return robloxApiLoadPromise;
    }

    function membersToCompletionMap(rawMembers, detailPrefix) {
      const result = {};

      for (const [name, kind] of Object.entries(rawMembers || {})) {
        if (HIDDEN_DEPRECATED_BUILTINS.has(`${detailPrefix}.${name}`)) continue;
        result[name] = {
          kind,
          detail: `${detailPrefix} ${kind === "function" ? "method" : "member"}`
        };
      }

      return result;
    }

    function getWordRange(model, position) {
      const word = model.getWordUntilPosition(position);

      return new monaco.Range(
        position.lineNumber,
        word.startColumn,
        position.lineNumber,
        word.endColumn
      );
    }

    function getDatatypeValueMembers(typeName) {
      if (!typeName) return null;
      const raw = BUILTIN_MEMBER_SETS[typeName];
      if (!raw) return null;
      const result = membersToCompletionMap(raw, typeName);
      // Constructors belong to the global datatype table, not an instance.
      for (const name of Object.keys(ROBLOX_DATATYPE_STATIC[typeName] || {})) delete result[name];
      return result;
    }

    function membersForType(typeName) {
      if (!typeName) return null;
      if (ROBLOX_API.ready && ROBLOX_API.classes.has(typeName)) return getRobloxApiMembers(typeName);
      if (ROBLOX_CORE_FALLBACK[typeName]) return {
        ...ROBLOX_CORE_FALLBACK.Instance,
        ...(["Script", "LocalScript", "ModuleScript"].includes(typeName)
          ? ROBLOX_CORE_FALLBACK.LuaSourceContainer : {}),
        ...ROBLOX_CORE_FALLBACK[typeName]
      };
      if (ROBLOX_CORE_INSTANCE_PARENTS[typeName]) {
        const parentType = ROBLOX_CORE_INSTANCE_PARENTS[typeName];
        return {...ROBLOX_CORE_FALLBACK.Instance, ...membersToCompletionMap(BUILTIN_MEMBER_SETS[parentType], parentType)};
      }
      if (["BasePart", "Model", "Player", "Humanoid", "RemoteEvent", "RemoteFunction"].includes(typeName)) {
        return {...ROBLOX_CORE_FALLBACK.Instance, ...membersToCompletionMap(BUILTIN_MEMBER_SETS[typeName], typeName)};
      }
      if (SERVICE_MEMBER_SETS[typeName]) {
        const serviceMembers = membersToCompletionMap(SERVICE_MEMBER_SETS[typeName], typeName);
        if (typeName === "Players") serviceMembers.LocalPlayer = {
          kind: "field", returnClass: "Player", detail: "Players.LocalPlayer"
        };
        return {...ROBLOX_CORE_FALLBACK.Instance, ...serviceMembers};
      }
      return getDatatypeValueMembers(typeName);
    }

    // `:` is a method call, never a global-name search or property lookup.
    // Internal Lua metamethod names are implementation details, not normal
    // Instance methods in Roblox Studio's completion list.
    function shouldSuggestMember(symbols, owner, operator, memberName, memberInfo) {
      if (!memberName || /^__/.test(memberName)) return false;
      if (operator !== ":") return true;
      if (memberInfo?.kind !== "function" && memberInfo?.kind !== "method") return false;
      // These tables are accessed with `.`, not by passing an implicit self.
      if (LIBRARY_MEMBERS[owner] || symbols.namespaces[owner] || symbols.enums[owner] ||
          symbols.classes[owner] || owner === "Enum" || ROBLOX_DATATYPE_STATIC[owner]) return false;
      return true;
    }

    // Identify a member expression before Monaco considers ordinary globals
    // or type suggestions. Includes call receivers such as UserSettings(): and
    // game:GetService("Players"):; unresolved expressions must return nothing.
    function isTypeAnnotationCompletion(lineBefore, symbols, cursorOffset, isLaua) {
      if (/^\s*(?:local|const|type|export\s+type)\s+[A-Za-z_]\w*\s*:\s*[A-Za-z_0-9]*$/.test(lineBefore)) return true;
      if (/\b(?:function|constructor)\s*(?:[A-Za-z_]\w*)?\s*\([^()]*\b[A-Za-z_]\w*\s*:\s*[A-Za-z_0-9]*$/.test(lineBefore)) return true;
      return Boolean(isLaua && findClassAtOffset(symbols, cursorOffset) &&
        /^\s*[A-Za-z_]\w*\s*:\s+[A-Za-z_0-9]*$/.test(lineBefore));
    }

    function getCompletionMemberContext(lineBefore) {
      const suffix = lineBefore.match(/([.:])\s*([A-Za-z_]\w*)?$/);
      if (!suffix) return null;
      const before = lineBefore.slice(0, suffix.index).trimEnd();
      if (!before || before.endsWith(".") || before.endsWith(":")) return null;
      const receiver = before.match(/([A-Za-z_]\w*(?:(?:\([^()\n]*\)|\[[^\]\n]*\])|\s*[.:]\s*[A-Za-z_]\w*)*)$/);
      return {owner: receiver?.[1]?.replace(/\s*([.:])\s*/g, "$1") || null, operator: suffix[1], partial: suffix[2] || ""};
    }

    function getRobloxResolvedMembers(className) {
      if (!className) return null;
      if (ROBLOX_API.ready && ROBLOX_API.classes.has(className)) return getRobloxApiMembers(className);
      return membersForType(className);
    }

    function getChainedMembers(symbols, expression, cursorOffset) {
      // Resolve receivers left to right. Unknown types stop the chain instead
      // of leaking unrelated globals into the completion dropdown.
      const value = expression.trim();
      const start = value.match(/^([A-Za-z_]\w*)(\s*\(\s*\))?/);
      if (!start) return null;
      const rootName = start[1];
      const rootCall = Boolean(start[2]);
      let currentClass = rootCall && rootName === "UserSettings" ? "UserSettings"
        : rootCall && rootName === "settings" ? "GlobalSettings"
        : !rootCall ? (symbols.locals[rootName]?.robloxClass || symbols.locals[rootName]?.service ||
            symbols.parameters[rootName]?.type?.replace(/\?$/, "").trim() || null) : null;
      let members = currentClass ? getRobloxResolvedMembers(currentClass) : getSymbolMembers(symbols, rootName, ".", cursorOffset);
      if (rootCall && !currentClass) return null;
      let remainder = value.slice(start[0].length);
      if (!remainder.trim()) return members;
      while (remainder.length > 0) {
        const step = remainder.match(/^\s*([.:])\s*([A-Za-z_]\w*)(\s*\((?:[^()"']|"[^"\n]*"|'[^'\n]*')*\))?/);
        if (!step) return null;
        const property = step[2];
        const args = step[3] || "";
        if (!members || !members[property]) return null;
        const member = members[property];
        if (step[1] === ":" && member.kind !== "function" && member.kind !== "method") return null;
        let nextType = member.returnClass || null;
        if (member.kind === "enum" && ROBLOX_API.enums.has(property)) {
          if (args) return null;
          members = getRobloxEnumItems(property);
          remainder = remainder.slice(step[0].length);
          continue;
        }
        if (args && (property === "GetService" || property === "FindService")) {
          const name = args.match(/^\s*\(\s*["']([A-Za-z_]\w*)["']\s*\)$/)?.[1];
          // game:GetService() accepts game services; UserSettings() exposes
          // UserGameSettings, not arbitrary classes. Never infer a class from
          // an invalid string argument.
          const userSettingsProvider = currentClass === "UserSettings";
          const gameService = name && (ROBLOX_API.ready
            ? ROBLOX_API.services.has(name)
            : ROBLOX_SERVICES.includes(name));
          nextType = userSettingsProvider
            ? (name === "UserGameSettings" ? name : null)
            : (gameService ? name : null);
        }
        if (args && member.kind !== "function" && member.kind !== "method") return null;
        members = getRobloxResolvedMembers(nextType);
        remainder = remainder.slice(step[0].length);
      }
      return members;
    }

    function completeRobloxStringArgument(model, position, lineBefore) {
      const match = lineBefore.match(/(?:\b(Instance)\.new|\b(game):GetService|\b(UserSettings\s*\(\s*\)):GetService|\b[A-Za-z_]\w*:(?:IsA|FindFirstChildOfClass|FindFirstChildWhichIsA))\s*\(\s*(["'])([A-Za-z_]\w*)?$/);
      if (!match) return null;
      const kind = match[1] === "Instance" ? "construct" : match[2] === "game" ? "service" : match[3] ? "userSettingsService" : "class";
      let names;
      if (kind === "service") names = ROBLOX_API.ready ? [...ROBLOX_API.services] : ROBLOX_SERVICES;
      else if (kind === "userSettingsService") names = ["UserGameSettings"];
      else if (ROBLOX_API.ready) names = [...ROBLOX_API.classes].filter(([, info]) => kind !== "construct" ||

                .filter(attribute => attribute.slice(1).toLowerCase().startsWith(partial))
                .map(attribute => ({
                  label: attribute,
                  kind: monaco.languages.CompletionItemKind.Keyword,
                  insertText: attribute.slice(1),
                  detail: "Luau attribute",
                  documentation: LUAU_SPECIAL_DOCS[attribute],
                  sortText: "0000_" + attribute,
                  range

            };
          }

          const directiveMatch = lineBefore.match(/--!([A-Za-z_]*)$/);

          if (directiveMatch) {
            const partial = directiveMatch[1].toLowerCase();
            if (LUAU_DIRECTIVES.some(directive => directive.slice(3) === directiveMatch[1])) return { suggestions: [] };

            return {
              suggestions: LUAU_DIRECTIVES
                .filter(directive => directive.slice(3).toLowerCase().startsWith(partial))
                .map(directive => ({
                  label: directive,
                  kind: monaco.languages.CompletionItemKind.Keyword,
                  insertText: directive.slice(3),
                  detail: "Luau script directive",
                  documentation: LUAU_SPECIAL_DOCS[directive],
                  sortText: "0000_" + directive,
                  range

          const keywordDocs = LAUA_KEYWORD_DOCS;

          const makeKeyword = (label, detail = "Luau keyword") => ({
            label,
            kind: monaco.languages.CompletionItemKind.Keyword,
            insertText: label,
            detail,
            documentation: keywordDocs[label] || undefined,
            sortText: "0100_" + label,
            range

          const makeName = (label, kind, detail, priority = "0300") => ({
            label,
            kind,
            insertText: label,
            detail,
            sortText: priority + "_" + label,
            range

          const isLaua = model.getLanguageId() === "laua";
          const typeContext = /(?:\b(?:type|export\s+type)\s+[A-Za-z_][A-Za-z_0-9]*(?:<[^>]*>)?\s*=|::|:|\||&)\s*[A-Za-z_0-9]*$/.test(lineBefore);
          const typedPrefix = word.word.toLowerCase();
          // Engine classes and enums are fetched from the Roblox Client Tracker
          // when needed. The local fallback is still usable offline.
          if (typeContext && !ROBLOX_API.ready && typedPrefix.length >= 2) {

          const suggestions = [
            ...LUAU_KEYWORDS.map(name => makeKeyword(name)),
            ...(isLaua ? LAUA_KEYWORDS.filter(name => name !== "self").map(name => makeKeyword(name, "Laua keyword")) : []),
            ...LUAU_TYPE_WORDS.map(name => makeName(name, monaco.languages.CompletionItemKind.TypeParameter, "Luau type", "0200")),
            ...LUAU_GLOBAL_FUNCTIONS.map(name => makeName(
              name,
              monaco.languages.CompletionItemKind.Function,
              LUAU_DEPRECATED_GLOBALS.has(name) ? "Deprecated Luau/Roblox global" : "Luau/Roblox global function",
              LUAU_DEPRECATED_GLOBALS.has(name) ? "0900" : "0300"

            ...LUAU_GLOBAL_OBJECTS.map(name => makeName(name, monaco.languages.CompletionItemKind.Variable, "Roblox/Luau global", "0300")),
            ...LUAU_LIBRARIES.map(name => makeName(name, monaco.languages.CompletionItemKind.Module, "Luau library", "0300")),
            ...LUAU_BUILTIN_TYPES.map(name => makeName(name, monaco.languages.CompletionItemKind.Class, "Roblox datatype or type", "0200")),
            ...LUAU_GLOBAL_CONSTANTS.map(name => makeName(name, monaco.languages.CompletionItemKind.Constant, "Luau global constant", "0300")),
            ...(isLaua ? LAUA_GLOBAL_FUNCTIONS.map(name => makeName(name, monaco.languages.CompletionItemKind.Function, "Laua built-in", "0300")) : [])
          ];

          // An up-to-date Roblox Studio API dump supplies hundreds of
          // additional engine types. They're not runtime globals, so only
          // present them as types, never as fake standalone constructors.
          if (typeContext && ROBLOX_API.ready) {
            for (const className of ROBLOX_API.classes.keys()) {

          }

          // Roblox Studio-style names only. Do not insert boilerplate templates,
          // generalized-iteration snippets, or speculative multi-line code.

          const sourceSymbols = getProjectSymbols(model);
          // `self` is a contextual Laua keyword, not a global Luau value.
          // Only suggest it where an instance receiver is supplied implicitly.
          if (isLaua && hasImplicitSelfAtOffset(model.getValue(), sourceSymbols, model.getOffsetAt(position))) {
            suggestions.unshift({
              label: "self",
              kind: monaco.languages.CompletionItemKind.Keyword,
              insertText: "self",
              detail: "Laua instance receiver",
              documentation: keywordDocs.self,
              sortText: "0000_self",
              range

          }
          const deprecatedFunctions = indexPlaygroundDeprecatedFunctions(model.getValue(), maskNonCode(model.getValue()));

          for (const [localName, localInfo] of Object.entries(sourceSymbols.locals)) {
            suggestions.unshift({
              label: localName,
              kind: monaco.languages.CompletionItemKind.Variable,
              insertText: localName,
              detail: localInfo.detail,
              sortText: "0000_local_" + localName,
              range
            });
          }

          for (const [functionName, functionInfo] of Object.entries(sourceSymbols.localFunctions)) {
            if (deprecatedFunctions.has(functionName)) continue;
            suggestions.unshift({
              label: functionName,
              kind: monaco.languages.CompletionItemKind.Function,
              insertText: functionName,
              detail: functionInfo.detail,
              documentation: functionInfo.params ? `Parameters: ${functionInfo.params}` : undefined,
              sortText: "0000_localfn_" + functionName,
              range
            });
          }

          for (const [parameterName, parameterInfo] of Object.entries(sourceSymbols.parameters)) {
            suggestions.unshift({
              label: parameterName,
              kind: monaco.languages.CompletionItemKind.Variable,
              insertText: parameterName,
              detail: parameterInfo.detail,
              sortText: "0000_param_" + parameterName,
              range
            });
          }

          for (const namespaceName of Object.keys(sourceSymbols.namespaces)) {
            suggestions.unshift({
              label: namespaceName,
              kind: monaco.languages.CompletionItemKind.Module,
              insertText: namespaceName,
              detail: "Laua namespace",
              sortText: "0000_" + namespaceName,
              range
            });
          }

          for (const enumName of Object.keys(sourceSymbols.enums)) {
            suggestions.unshift({
              label: enumName,
              kind: monaco.languages.CompletionItemKind.Enum,
              insertText: enumName,
              detail: "Laua enum",
              sortText: "0000_" + enumName,
              range
            });
          }

          for (const className of Object.keys(sourceSymbols.classes)) {
            suggestions.unshift({
              label: className,
              kind: monaco.languages.CompletionItemKind.Class,
              insertText: className,
              detail: "Laua class",
              sortText: "0000_" + className,
              range
            });

            if (/\bnew\s+[A-Za-z_][A-Za-z0-9_]*$/.test(lineBefore) || /\bnew\s*$/.test(lineBefore)) {
              suggestions.unshift({
                label: className,
                kind: monaco.languages.CompletionItemKind.Constructor,
                insertText: className,
                detail: "Laua class",
                sortText: "0000_new_" + className,
                range
              });
            }
          }

          const quotedCall = completeRobloxStringArgument(model, position, lineBefore);
          if (quotedCall) {
            if (!ROBLOX_API.ready) await ensureRobloxApiLoaded();
            const result = ROBLOX_API.ready
              ? completeRobloxStringArgument(model, position, lineBefore) || quotedCall
              : quotedCall;
            // A complete service, class or enum string is not a new completion.
            const quotedPartial = lineBefore.match(/["']([A-Za-z_][A-Za-z0-9_]*)$/)?.[1];
            if (quotedPartial && result.suggestions.some(item => item.label === quotedPartial)) return { suggestions: [] };
            return result;
          }

          const memberMatch = getCompletionMemberContext(lineBefore);

          if (memberMatch) {
            const owner = memberMatch.owner;
            const operator = memberMatch.operator;
            const cursorOffset = model.getOffsetAt(position);

            const localInfo = sourceSymbols.locals[owner];
            const parameterInfo = sourceSymbols.parameters[owner];
            const typedName =
              localInfo?.robloxClass ||
              localInfo?.service ||
              localInfo?.type?.replace(/\?$/, "").trim() ||
              parameterInfo?.type?.replace(/\?$/, "").trim();

            const needsRobloxApi =
              owner === "game" ||
              owner === "workspace" ||
              owner === "Enum" ||
              owner === "UserSettings" || owner === "UserSettings()" ||
              owner === "settings" || owner === "settings()" ||
              owner?.includes("GetService(") || owner?.includes("FindService(") ||
              ROBLOX_API.enums.has(owner) ||
              BUILTIN_MEMBER_SETS[owner] !== undefined ||
              SERVICE_MEMBER_SETS[owner] !== undefined ||
              (typedName && (
                BUILTIN_MEMBER_SETS[typedName] !== undefined ||
                SERVICE_MEMBER_SETS[typedName] !== undefined ||
                (!ROBLOX_PRIMITIVE_TYPES.has(typedName) && !ROBLOX_DATATYPE_STATIC[typedName] && !LIBRARY_MEMBERS[typedName])
              ));

            if (needsRobloxApi && !ROBLOX_API.ready) {
              await ensureRobloxApiLoaded();
            }

            // A buffer is a primitive, not an object with methods: complete
            // `buff.` to e.g. `buffer.readu8(buff, 0)` instead of invalid code.
            if (owner && isBufferVariable(sourceSymbols, owner)) {
              return { suggestions: operator === "."
                ? makeBufferCallSuggestions(monaco, model, position, owner, memberMatch.partial, lineBefore)
                : [] };
            }

            const members = !owner ? null : (owner.includes(".") || owner.includes(":") || owner.includes("("))
              ? getChainedMembers(sourceSymbols, owner, cursorOffset)
              : getSymbolMembers(sourceSymbols, owner, operator, cursorOffset);
            const memberSuggestions = [];

            if (members) {
              for (const [memberName, memberInfo] of Object.entries(members)) {
                if (deprecatedFunctions.has(`${owner}.${memberName}`) || deprecatedFunctions.has(`${owner}:${memberName}`)) continue;
                if (!shouldSuggestMember(sourceSymbols, owner, operator, memberName, memberInfo)) continue;
                if (memberMatch.partial && !memberName.toLowerCase().startsWith(memberMatch.partial.toLowerCase())) continue;
                const isFunction = memberInfo.kind === "function" || memberInfo.kind === "method";
                const params = memberInfo.params?.trim() || "";

                memberSuggestions.push({
                  label: memberName,
                  kind: memberInfo.kind === "enum"
                    ? monaco.languages.CompletionItemKind.EnumMember
                    : memberInfo.kind === "event"
                      ? monaco.languages.CompletionItemKind.Event
                      : isFunction
                        ? monaco.languages.CompletionItemKind.Method
                        : monaco.languages.CompletionItemKind.Field,
                  insertText: memberName,
                  detail: memberInfo.detail || "Laua member",
              documentation: [memberInfo.documentation, params ? `Parameters: ${params}` : ""].filter(Boolean).join("\n\n") || undefined,
                  sortText: "0000_" + memberName,
                  range
                });
              }
            }

            // A correctly finished member (InputBegan, GetService, Source,
            // etc.) must not keep offering longer or duplicate names.

            // An unresolved `object:` must NOT fall through to global names,
            // which previously made game:print / game:__index appear.
            // Only an actual type annotation may use the type-name catalog.
            const annotationContext = operator === ":" && typeContext &&
              isTypeAnnotationCompletion(lineBefore, sourceSymbols, cursorOffset, isLaua);
            if (!annotationContext) return { suggestions: memberSuggestions };
          }

          // Preserve genuine Studio/Laua symbols only. Deduplicate and filter
          // by prefix so typing never floods the list with irrelevant items.
          // This applies equally to keywords, globals, locals, class names,
          // types and libraries. `class` must NOT suggest `class` or
          // `classSomething` once the complete keyword was typed.
          if (word.word && suggestions.some(item => item.label === word.word)) {
            return { suggestions: [] };
          }
          const seenLabels = new Set();
          const completions = [];
          for (const item of suggestions) {
            const label = typeof item.label === "string" ? item.label : item.label?.label;
            if (!label) continue;
            // Monaco normally filters, but also filter here to prevent a
            // massive list of unrelated templates while the user is typing.
            const filterName = item.filterText || label;
            if (typedPrefix && !filterName.toLowerCase().startsWith(typedPrefix)) continue;
            if (seenLabels.has(label)) continue;
            seenLabels.add(label);
            completions.push(item);
          }
          return { suggestions: completions };

      monaco.editor.defineTheme("laua-dark", {
        base: "vs-dark",
        inherit: true,
        rules: [
          { token: "keyword.laua", foreground: "C084FC", fontStyle: "bold" },
          { token: "keyword.attribute", foreground: "F472B6", fontStyle: "bold" },
          { token: "keyword.directive", foreground: "F59E0B", fontStyle: "bold" },
          { token: "keyword", foreground: "60A5FA" },
          { token: "variable.predefined", foreground: "38BDF8", fontStyle: "bold" },
          { token: "support.function", foreground: "FDE68A" },
          { token: "support.namespace", foreground: "A5B4FC" },
          { token: "constant.predefined", foreground: "FB7185" },
          { token: "member", foreground: "93C5FD" },
          { token: "type.identifier", foreground: "67E8F9", fontStyle: "bold" },
          { token: "type", foreground: "67E8F9" },
          { token: "function", foreground: "FDE68A" },
          { token: "number", foreground: "FDBA74" },
          { token: "number.hex", foreground: "FDBA74" },
          { token: "number.binary", foreground: "FDBA74" },
          { token: "number.float", foreground: "FDBA74" },
          { token: "string", foreground: "86EFAC" },
          { token: "string.escape", foreground: "F9A8D4" },
          { token: "comment", foreground: "64748B", fontStyle: "italic" },
          { token: "operator", foreground: "F8FAFC" },
          { token: "operator.laua", foreground: "C084FC", fontStyle: "bold" },
          { token: "constant.language", foreground: "FB7185" }
        ],
        colors: {
          "editor.background": "#0f1115",
          "editorLineNumber.foreground": "#475569",
          "editorLineNumber.activeForeground": "#CBD5E1",
          "editorCursor.foreground": "#E2E8F0",
          "editor.selectionBackground": "#33415599",
          "editor.inactiveSelectionBackground": "#33415555",
          "editorIndentGuide.background1": "#202633",
          "editorIndentGuide.activeBackground1": "#475569",
          "editorBracketHighlight.foreground1": "#60A5FA",
          "editorBracketHighlight.foreground2": "#C084FC",
          "editorBracketHighlight.foreground3": "#34D399",
          "editorBracketHighlight.foreground4": "#FBBF24",
          "editorBracketHighlight.foreground5": "#FB7185",
          "editorSuggestWidget.background": "#151922",
          "editorSuggestWidget.border": "#334155",
          "editorHoverWidget.background": "#151922",
          "editorHoverWidget.border": "#334155"
        }
